<body>
<div id="app"></div>
<script src="../../assets/tutorial/tutorial.js"></script>
<script>
Tutorial.mount({
  label: "Interlúdio",
  title: "Ganchos na classe",
  steps: [
    {
      title: "Do topo para a classe",
      body: [
        `
        <p>Os ganchos do Scena, as linhas que dizem quando uma função roda (<code>@click</code>, <code>@hover</code>, <code>@every</code>, <code>@collide</code>, <code>@when</code>…), quase sempre apareceram no topo do arquivo. Mas o que é de cada objeto fica melhor na classe dele: o vaga-lume sabe o que fazer quando é clicado. Este interlúdio leva cada gancho para dentro de uma classe, com vaga-lumes que você pega com o mouse.</p>
        <p>No topo, o clique seria assim, com uma função de fora que recebe o vaga-lume clicado:</p>
        `,
        {
          snip: `@click(group["vagalumes"])
def pegou(vagalume):
    st.pegos += 1
    vagalume.destroy()`,
          alt: true
        },
        `
        <p>Na classe, o mesmo clique é um método, e quem foi clicado é o próprio <code>self</code>.</p>
        `
      ],
      code: `from random import uniform
from scena import *

init(width=1000, height=700, title="Vaga-lumes")
Wallpaper("#0a0f1e")

st.pegos = 0
Text(lambda: f"Pegos: {st.pegos}", top_left=(20, 680))


class Vagalume(Circle, radius=10, color="khaki", group="vagalumes"):
    def on_click(self):
        st.pegos += 1
        self.destroy()


for i in range(6):
    Vagalume(center=(uniform(100, 900), uniform(100, 600)))


run()
`,
      notes: [
        {
          at: "Text(lambda: f\"Pegos",
          text: "O texto é uma fórmula: mostra a contagem e muda sozinho quando <code>st.pegos</code> muda."
        },
        {
          at: "def on_click(self):",
          text: "<code>on_click</code> (ao clicar) é um método com nome fixo. Não leva <code>@</code>: o nome já diz quando ele roda. E não recebe ninguém: <code>self</code> já é o vaga-lume clicado."
        }
      ],
      after: `
        <p>Rode e pegue os seis vaga-lumes.</p>
      `
    },
    {
      title: "Passar por cima",
      body: `
        <p>O vaga-lume brilha quando o mouse passa por cima.</p>
      `,
      code: `from random import uniform
from scena import *

init(width=1000, height=700, title="Vaga-lumes")
Wallpaper("#0a0f1e")

st.pegos = 0
Text(lambda: f"Pegos: {st.pegos}", top_left=(20, 680))


class Vagalume(Circle, radius=10, color="khaki", group="vagalumes"):
    def on_click(self):
        st.pegos += 1
        self.destroy()

    def on_hover(self):
        self.glow = True

    def on_hover_exit(self):
        self.glow = False


for i in range(6):
    Vagalume(center=(uniform(100, 900), uniform(100, 600)))


run()
`,
      notes: [
        {
          at: "def on_hover(self):",
          text: "<code>on_hover</code> (o mouse entrou) e <code>on_hover_exit</code> (o mouse saiu) são o par <code>@hover</code> e <code>@hover_exit</code>, como métodos. O que um acende, o outro apaga."
        }
      ]
    },
    {
      title: "O tempo de cada um",
      body: [
        `
        <p>Agora os vaga-lumes voam e piscam. O piscar é um timer, e um timer também cabe na classe:</p>
        `,
        {
          snip: `@every(1.2)
def piscar(self):
    self.flash(0.3)`
        },
        `
        <p>Em cima de um método, <code>@every</code> (a cada) cria um timer de cada objeto: cada vaga-lume ganha o seu, que começa quando ele nasce. <code>flash(0.3)</code> (piscar) clareia o vaga-lume por 0.3 s.</p>
        `
      ],
      code: `from random import uniform
from scena import *

init(width=1000, height=700, title="Vaga-lumes")
Wallpaper("#0a0f1e")

st.pegos = 0
Text(lambda: f"Pegos: {st.pegos}", top_left=(20, 680))


class Vagalume(Circle, radius=10, color="khaki", group="vagalumes"):
    def on_update(self, dt):
        self.move_by(uniform(-60, 60) * dt, 40 * dt)

    def on_click(self):
        st.pegos += 1
        self.destroy()

    def on_hover(self):
        self.glow = True

    def on_hover_exit(self):
        self.glow = False

    @every(1.2)
    def piscar(self):
        self.flash(0.3)


for i in range(6):
    Vagalume(center=(uniform(100, 900), uniform(100, 600)))


run()
`,
      notes: [
        {
          at: "uniform(-60, 60) * dt, 40 * dt",
          text: "Sobe 40 por segundo. Para os lados, um valor sorteado a cada quadro, entre −60 e 60: o zigue-zague."
        }
      ],
      after: `
        <p>Rode e olhe os seis.</p>
        <details class="ask"><summary>Eles piscam juntos ou cada um no seu ritmo?</summary><p>Juntos: os seis nasceram no mesmo quadro, e os seis relógios começaram juntos. Um vaga-lume que nascesse depois piscaria fora de compasso.</p></details>
        <p>Pegue um: o timer dele para junto. Ninguém precisa lembrar de cancelar nada.</p>
      `
    },
    {
      title: "Sair da tela",
      body: `
        <p>Um vaga-lume que voa para fora da tela não volta, e continuaria no jogo, voando onde ninguém vê. Ele precisa ser destruído quando sai.</p>
      `,
      code: `from random import uniform
from scena import *

init(width=1000, height=700, title="Vaga-lumes")
Wallpaper("#0a0f1e")

st.pegos = 0
Text(lambda: f"Pegos: {st.pegos}", top_left=(20, 680))


class Vagalume(Circle, radius=10, color="khaki", group="vagalumes"):
    def on_update(self, dt):
        self.move_by(uniform(-60, 60) * dt, 40 * dt)

    def on_click(self):
        st.pegos += 1
        self.destroy()

    def on_hover(self):
        self.glow = True

    def on_hover_exit(self):
        self.glow = False

    @every(1.2)
    def piscar(self):
        self.flash(0.3)

    @leave_playfield
    def fugiu(self):
        self.destroy()


for i in range(6):
    Vagalume(center=(uniform(100, 900), uniform(100, 600)))


run()
`,
      notes: [
        {
          at: "@leave_playfield",
          text: "<code>@leave_playfield</code> (saiu do campo de jogo) na classe vai sem nome de grupo: vale para cada objeto da classe, e o método recebe só o <code>self</code>, o que saiu. No topo, seria <code>@leave_playfield(\"vagalumes\")</code>."
        }
      ],
      after: `
        <p>Rode e espere: os vaga-lumes que você não pega sobem até sumir.</p>
      `
    },
    {
      title: "Uma noite sem desenho",
      body: `
        <p>Os vaga-lumes acabam. Alguém precisa soltar novos de tempos em tempos, mas isso não é trabalho de um vaga-lume: é da noite. E a noite não tem desenho.</p>
      `,
      code: `from random import uniform
from scena import *

init(width=1000, height=700, title="Vaga-lumes")
Wallpaper("#0a0f1e")

st.pegos = 0
Text(lambda: f"Pegos: {st.pegos}", top_left=(20, 680))


class Vagalume(Circle, radius=10, color="khaki", group="vagalumes"):
    def on_update(self, dt):
        self.move_by(uniform(-60, 60) * dt, 40 * dt)

    def on_click(self):
        st.pegos += 1
        self.destroy()

    def on_hover(self):
        self.glow = True

    def on_hover_exit(self):
        self.glow = False

    @every(1.2)
    def piscar(self):
        self.flash(0.3)

    @leave_playfield
    def fugiu(self):
        self.destroy()


class Noite(Entity):
    @every(0.8)
    def soltar(self):
        Vagalume(center=(uniform(50, 950), uniform(20, 300)))


for i in range(6):
    Vagalume(center=(uniform(100, 900), uniform(100, 600)))

noite = Noite()


run()
`,
      notes: [
        {
          at: "class Noite(Entity):",
          text: "<code>Entity</code> (entidade) é o objeto mais simples do Scena: não tem forma, não aparece, não colide. Mas tem tudo o que uma classe do Scena tem: <code>setup</code>, <code>on_update</code>, timers, ganchos."
        },
        {
          at: "noite = Noite()",
          text: "Criar a noite liga o timer dela: um vaga-lume novo a cada 0,8 segundo, num lugar sorteado."
        }
      ],
      after: `
        <p>Rode: os novos nascem em momentos diferentes, cada um com o seu relógio, e agora piscam fora de compasso.</p>
        <details class="ask"><summary>Por que não um <code>@every</code> no topo?</summary><p>Funcionaria. Mas um objeto é dono do seu tempo: quando a noite for destruída, o timer dela para junto, como o do vaga-lume.</p></details>
      `
    },
    {
      title: "Uma condição na classe",
      body: `
        <p>Com dez vaga-lumes pegos, o pote enche: aparece um aviso, e a noite acaba.</p>
      `,
      code: `from random import uniform
from scena import *

init(width=1000, height=700, title="Vaga-lumes")
Wallpaper("#0a0f1e")

st.pegos = 0
Text(lambda: f"Pegos: {st.pegos}", top_left=(20, 680))
aviso = Text("Pote cheio!", center=(500, 350), font_size=60, color="gold")
aviso.visible = False


class Vagalume(Circle, radius=10, color="khaki", group="vagalumes"):
    def on_update(self, dt):
        self.move_by(uniform(-60, 60) * dt, 40 * dt)

    def on_click(self):
        st.pegos += 1
        self.destroy()

    def on_hover(self):
        self.glow = True

    def on_hover_exit(self):
        self.glow = False

    @every(1.2)
    def piscar(self):
        self.flash(0.3)

    @leave_playfield
    def fugiu(self):
        self.destroy()


class Noite(Entity):
    @every(0.8)
    def soltar(self):
        Vagalume(center=(uniform(50, 950), uniform(20, 300)))

    @when(lambda self: st.pegos >= 10)
    def cheio(self):
        aviso.visible = True
        self.destroy()


for i in range(6):
    Vagalume(center=(uniform(100, 900), uniform(100, 600)))

noite = Noite()


run()
`,
      notes: [
        {
          at: "@when(lambda self:",
          text: "<code>@when</code> (quando) confere a pergunta a cada quadro; quando a resposta vira sim, <code>cheio</code> roda uma vez. Na classe, a <code>lambda</code> recebe o objeto. Esta pergunta não usa o <code>self</code>, mas poderia: <code>lambda self: self.radius &gt; 20</code>."
        }
      ],
      after: `
        <p>Rode e pegue dez.</p>
        <details class="ask"><summary>E os vaga-lumes que ainda estão voando?</summary><p>Continuam até serem pegos ou saírem da tela. O <code>self.destroy()</code> do <code>cheio</code> destrói só a noite, e com ela o timer: nenhum vaga-lume novo nasce.</p></details>
      `,
      dive: [
        {
          title: "Cada gancho, nos dois lugares",
          body: `
            <p>Todo gancho do topo do arquivo tem a sua forma na classe. Os gestos do mouse viram métodos com nome fixo, sem <code>@</code>; os outros continuam com <code>@</code>, mas sem o nome do grupo, porque valem para cada objeto da classe.</p>
            <div class="tbl"><table>
              <thead><tr><th>No topo do arquivo</th><th>Na classe</th></tr></thead>
              <tbody>
                <tr><td><code>@click(alvo)</code></td><td><code>def on_click(self)</code></td></tr>
                <tr><td><code>@hover(alvo)</code> · <code>@hover_exit(alvo)</code></td><td><code>def on_hover(self)</code> · <code>def on_hover_exit(self)</code></td></tr>
                <tr><td><code>@drag_to(peca)</code></td><td><code>def on_drag_to(self, alvo, pos)</code></td></tr>
                <tr><td><code>@drop_by(alvo)</code></td><td><code>def on_drop_by(self, peca, pos)</code></td></tr>
                <tr><td><code>@collide("a", "b")</code></td><td><code>@collide_with("b")</code></td></tr>
                <tr><td><code>@collide_stay</code> · <code>@collide_exit</code></td><td><code>@collide_with_stay</code> · <code>@collide_with_exit</code></td></tr>
                <tr><td><code>@every(1)</code> · <code>@after(2)</code></td><td><code>@every(1)</code> · <code>@after(2)</code>, de cada objeto</td></tr>
                <tr><td><code>@leave_playfield("grupo")</code></td><td><code>@leave_playfield</code>, sem nome</td></tr>
                <tr><td><code>@when(lambda: …)</code></td><td><code>@when(lambda self: …)</code></td></tr>
                <tr><td><code>@on_change(st["x"])</code></td><td><code>@on_change(lambda self: …)</code></td></tr>
                <tr><td><code>def update(dt)</code></td><td><code>def on_update(self, dt)</code></td></tr>
                <tr><td><code>on_mouse_click</code>, <code>on_key_down</code>…</td><td>só no topo; na classe, <code>keyp</code> no <code>on_update</code></td></tr>
              </tbody>
            </table></div>
            <p>Os gestos do mouse não aceitam <code>@click</code> acima de um método: na classe ainda não há objeto para clicar. O Scena recusa e diz o nome do método. Se quiser outro nome, ligue no <code>setup</code>: <code>self.on_click = self.pegar</code>.</p>
            <p>Qual escolher? O que é de cada um (o clique num vaga-lume, o piscar dele, a saída da tela) vai na classe. O que é do conjunto (a contagem, um placar, uma regra entre dois grupos) fica no topo, ou num objeto como a noite.</p>
            <p>No Guia: <a href="../guide/index.html#reagir-callbacks-entity">Callbacks da Entity</a> · <a href="../guide/index.html#reagir-pointer">Clique / arraste</a>.</p>
          `,
          try: [
            {
              note: "Um vigia de mudança na classe: cada vaga-lume pisca quando outro é pego. <code>@on_change(lambda self: st.pegos)</code> roda em cada vaga-lume, a cada mudança da contagem; a função recebe o valor novo. Dentro da classe <code>Vagalume</code>, no lugar do <code>@every</code> e do <code>piscar</code>:",
              replaces: ['@every(1.2)', 'def piscar(self):', 'self.flash(0.3)'],
              code: `@on_change(lambda self: st.pegos)
def assustar(self, valor):
    self.flash(0.3)`
            }
          ]
        }
      ],
      closing: `
        <p>Pegue os vaga-lumes com o mouse; eles brilham quando o mouse passa e piscam sozinhos. A noite solta um novo a cada 0,8 segundo, até o pote encher com dez.</p>
      `
    }
  ]
});
</script>
