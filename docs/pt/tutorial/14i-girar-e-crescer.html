      body: `
        <p>Um interlúdio é uma pausa entre dois tutoriais para olhar de perto uma ideia que a série já usou. Girar apareceu aos pedaços: no 05, <code>rotate_to(180)</code> virou o laser para baixo; no 11, <code>rotate_by(90 * dt)</code> girou o triângulo sob o mouse; no 14, <code>rotate_by(360, time=1.0, loops="forever")</code> girou o anel, e <code>sonda.angle = heading(…)</code> apontou a sonda. São três escritas. Aqui você vê quando elas fazem a mesma coisa e quando não fazem. No fim, o mesmo para o tamanho.</p>
        <p><strong>Até e por.</strong> <code>rotate_to</code> (girar até) leva o ângulo até um número: depois de <code>rotate_to(45)</code>, o ângulo é 45, de onde quer que a barra tenha partido. <code>rotate_by</code> (girar por) soma: <code>rotate_by(45)</code> gira mais 45 graus a partir de onde a barra está. Aperte Espaço algumas vezes. A barra azul vai a 45 e fica; a dourada vai a 45, 90, 135…: cada aperto soma mais um oitavo de volta.</p>
        <p><strong>O número embaixo.</strong> <code>angle</code> (ângulo) é quanto a barra está girada, em graus, contados no sentido contrário ao dos ponteiros do relógio (a roda dos graus está no Apêndice D). Cada texto é uma fórmula, como no 09: ele lê o <code>angle</code> da sua barra e se refaz quando o número muda.</p>
      `,
      code: `from scena import *

Text("rotate_by(45)", center=(700, 220))
Text(lambda: f"angle = {round(ate.angle)}", center=(300, 180))
Text(lambda: f"angle = {round(por.angle)}", center=(700, 180))


def update(dt):
    if keyp.once("SPACE"):
        ate.rotate_to(45)
        por.rotate_by(45)


run()
`

        <p>Com <code>time=</code> (tempo), do 12, o giro dura um segundo, e dá para ver o caminho.</p>
        <p><strong>Uma volta inteira.</strong> <code>rotate_by(360, time=1)</code> dá uma volta inteira em um segundo. <code>rotate_to(360, time=1)</code> não sai do lugar: 360 graus apontam para o mesmo lado que 0, e a barra já está lá. Até um lugar onde você já está, não há caminho.</p>
        <p><strong>O ângulo soma.</strong> Aperte Espaço de novo depois de cada volta. O texto da dourada mostra 360, 720, 1080: o <code>rotate_by</code> soma sempre, e o ângulo não volta para 0. São voltas inteiras, então a barra aponta sempre para o mesmo lado.</p>

        <p><code>angle</code> também é um campo, como <code>width</code> (largura): dá para ler, escrever com <code>=</code> e ligar com <code>@=</code>, como no 09. Este script gira duas caixas no <code>update</code>, 45 graus por segundo. A azul soma no campo: <code>campo.angle += 45 * dt</code>. A dourada chama o verbo: <code>verbo.rotate_by(45 * dt)</code>.</p>

      body: `
        <p>E se o verbo tiver de girar em volta do canto? <code>about=</code> (em volta de) escolhe o ponto que fica parado. <code>canto = verbo.top_left</code> guarda o canto da dourada, e <code>verbo.rotate_by(45 * dt, about=canto)</code> gira em volta dele. Rode: agora as duas caixas giram iguais.</p>
        <p><strong>Qual usar.</strong> O campo, quando a forma foi posta pelo ponto que deve ficar parado (o ponteiro preso pela ponta) ou quando você já sabe a direção (a sonda do 14 lê o rumo e o escreve no <code>angle</code>). O verbo, quando o giro é um movimento: uma volta, um pouco a cada quadro, em volta do centro ou, com <code>about=</code>, de qualquer ponto, como uma porta na dobradiça.</p>
      `,
      code: `from scena import *

`,

      body: `
        <p>No 03, um segmento ficava preso a duas âncoras: <code>Anchor</code> é um ponto que nasce visível e arrastável, e a <code>Line</code> lia as âncoras com <code>lambda</code>. Um <code>Rect</code> também pode nascer por dois cantos opostos, <code>p1</code> e <code>p2</code>: o de baixo, à esquerda, e o de cima, à direita. Com <code>lambda</code> nos dois, a caixa fica presa às âncoras. Arraste uma âncora: a caixa estica junto.</p>
        <p><strong>Girar o campo.</strong> As setas mudam <code>presa.angle</code>. Segure a seta da esquerda e olhe: a caixa não gira inteira. Os cantos estão presos às âncoras, e o campo <code>angle</code> mantém os pontos pelos quais a caixa foi posta. Então ela inclina e, para os cantos continuarem nas âncoras, muda de tamanho. O texto mostra a largura e a altura mudando.</p>
        <p><strong>Uma linha.</strong> Perto de 23 graus, a caixa vira uma linha. A diagonal, a reta de uma âncora à outra, sobe uns 23 graus; com esse ângulo, a diagonal fica deitada sobre um lado, e a caixa não tem altura nenhuma. Continue: depois ela engorda de novo, e a 90 graus volta com a largura e a altura trocadas.</p>
      `,

      code: `from scena import *

      body: `
        <p>O tamanho tem o mesmo par. <code>scale</code> (escala) é o tamanho em vezes: 1 é o tamanho com que a forma nasceu, 2 é o dobro, 0.5 é a metade. <code>scale_to</code> (mudar a escala até) leva a escala até um número; <code>scale_by</code> (mudar a escala por) multiplica a escala que a forma já tem.</p>

            <p>Os verbos vêm em pares: o que termina em <code>_to</code> vai <em>até</em> um valor, e o que termina em <code>_by</code> anda <em>por</em> uma quantia, a partir de onde a forma está. Os campos <code>angle</code> e <code>scale</code> guardam o valor de agora.</p>
