        <p>Este apêndice mostra as formas do Scena e os jeitos de pôr cada uma na tela. Cada seção é um programa que desenha as variantes de uma forma lado a lado, cada uma com o seu nome embaixo. Rode, mude os números e rode de novo.</p>
        <p>Uma forma pode ser dada de vários jeitos: pelo centro e pelo tamanho, por um canto, por dois pontos. Cada jeito é um <strong>modelo</strong> (de construção). O desenho pode sair igual, mas a forma guarda coisas diferentes, e isso aparece quando você a arrasta ou a liga a outra.</p>
        <p>Primeiro, cinco modelos do <code>Circle</code> (círculo).</p>
      `,

run()
