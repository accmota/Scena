from scena import *

init(width=640, height=360, title="Avião")
Wallpaper("backgrounds/mountains/mountains1.png")

folha = Sheet("plane/Fly1.png", "plane/Fly2.png", "plane/Dead.png")
folha.clip("voando", [0, 1], fps=12)
folha.clip("caindo", [2])
pecas = Sheet("k-rolling-ball/rollingBall_sheet@2.png", atlas="k-rolling-ball/rollingBall_sheet@2.xml")

st.pontos = 0
st.voando = True

aviso = Text(text="", center=(320, 200), font_size=24, color="navy")


class Aviao(Sprite, source=folha, height=40):
    def setup(self):
        self.play("voando")

    def on_update(self, dt):
        if st.voando:
            alvo = 0
            if keyp("UP"):
                alvo = 30
            if keyp("DOWN"):
                alvo = -30
            self.rotate_to(chase(self.angle, alvo, rate=4))
            seta = vec_from_angle(self.angle, length=220)
            self.move_by(0, seta.y * dt)
            self.confine(canvas.game_view)
            if self.center.y < 30:
                self.cair()
        elif self.center.y > 30:
            self.rotate_to(chase(self.angle, -60, rate=3))
            self.move_by(0, -160 * dt)

    @collide_with("porta")
    def passou(self, porta):
        porta.destroy()
        st.pontos += 1
        play_sound("audio/fx2.wav")

    @collide_with("pilar")
    def bateu(self, pilar):
        if st.voando:
            self.cair()

    def cair(self):
        st.voando = False
        self.play("caindo")
        canvas.shake(6)
        play_sound("audio/explosion02.wav")
        aviso.text = "Aperte espaço"


aviao = Aviao(center=(120, 200))


def novo_par():
    meio = uniform(110, 250)
    Sprite(pecas, frame="block_narrow.png", height=260, center=(680, meio + 190), group="pilar")
    Sprite(pecas, frame="block_narrow.png", height=260, center=(680, meio - 190), group="pilar")
    porta = Rect(center=(690, meio), width=10, height=120, group="porta")
    porta.visible = False


@every(2)
def mais_pilares():
    if st.voando:
        novo_par()


def recomecar():
    group["pilar"].destroy()
    group["porta"].destroy()
    st.pontos = 0
    st.voando = True
    aviso.text = ""
    aviao.center = (120, 200)

        group["porta"].move_by(-120 * dt, 0)
    elif keyp("SPACE"):
        recomecar()


@leave_playfield("pilar", "porta")
def saiu(coisa):
    coisa.destroy()


run()

        <p><strong>O controle do som.</strong> <code>play_sound</code> devolve um controle do som que está tocando, guardado em <code>musica</code>. <code>musica.fade_to(0.1, time=1)</code> (esmaecer até) abaixa o volume para 0.1 em um segundo, sem cortar: na queda, a música quase some. <code>recomecar</code> a traz de volta a 0.5.</p>
      `,
      code: `from random import uniform
from scena import *

init(width=640, height=360, title="Avião")
Wallpaper("backgrounds/mountains/mountains1.png")

nuvens = canvas.layers.create("nuvens", scroll=(-12, 0), below="default")
montes = canvas.layers.create("montes", scroll=(-36, 0), below="default")
mato = canvas.layers.create("mato", scroll=(-84, 0), below="default")
Endless("nuvens", "backgrounds/mountains/mountains2.png", height=360)
Endless("montes", "backgrounds/mountains/mountains3.png", height=360)
Endless("mato", "backgrounds/mountains/mountains4.png", height=360)

folha = Sheet("plane/Fly1.png", "plane/Fly2.png", "plane/Dead.png")
folha.clip("voando", [0, 1], fps=12)
folha.clip("caindo", [2])
pecas = Sheet("k-rolling-ball/rollingBall_sheet@2.png", atlas="k-rolling-ball/rollingBall_sheet@2.xml")

st.pontos = 0
st.voando = True
st.velocidade = 120

musica = play_sound("audio/SuperHero_original_no_Intro.ogg", loops="forever", volume=0.5)

placar = Text(text="", top_left=(16, 346), font_size=18, color="navy")
placar["text"] @= lambda: f"Pontos {st.pontos}"
aviso = Text(text="", center=(320, 200), font_size=24, color="navy")


class Aviao(Sprite, source=folha, height=40):
    def setup(self):
        self.play("voando")

    def on_update(self, dt):
        if st.voando:
            alvo = 0
            if keyp("UP"):
                alvo = 30
            if keyp("DOWN"):
                alvo = -30
            self.rotate_to(chase(self.angle, alvo, rate=4))
            seta = vec_from_angle(self.angle, length=220)
            self.move_by(0, seta.y * dt)
            self.confine(canvas.game_view)
            if self.center.y < 30:
                self.cair()
        elif self.center.y > 30:
            self.rotate_to(chase(self.angle, -60, rate=3))
            self.move_by(0, -160 * dt)

    @collide_with("porta")
    def passou(self, porta):
        porta.destroy()
        st.pontos += 1
        play_sound("audio/fx2.wav")

    @collide_with("pilar")
    def bateu(self, pilar):
        if st.voando:
            self.cair()

    def cair(self):
        st.voando = False
        self.play("caindo")
        canvas.shake(6)
        play_sound("audio/explosion02.wav")
        self.fogo = Fire(center=lambda: self.center, width=14, style="plume")
        aviso.text = "Aperte espaço"
        musica.fade_to(0.1, time=1)


aviao = Aviao(center=(120, 200))


def novo_par():
    meio = uniform(110, 250)
    Sprite(pecas, frame="block_narrow.png", height=260, center=(680, meio + 190), group="pilar")
    Sprite(pecas, frame="block_narrow.png", height=260, center=(680, meio - 190), group="pilar")
    porta = Rect(center=(690, meio), width=10, height=120, group="porta")
    porta.visible = False


@every(2)
def mais_pilares():
    if st.voando:
        novo_par()


def recomecar():
    group["pilar"].destroy()
    group["porta"].destroy()
    st.pontos = 0
    st.voando = True
    st.velocidade = 120
    aviso.text = ""
    aviao.center = (120, 200)
    aviao.rotate_to(0)
    aviao.play("voando")
    aviao.fogo.destroy()
    musica.fade_to(0.5, time=1)


def update(dt):
    if not st.voando:
        st.velocidade = chase(st.velocidade, 0, rate=2)
        if keyp("SPACE"):
            recomecar()
    group["pilar"].move_by(-st.velocidade * dt, 0)
    group["porta"].move_by(-st.velocidade * dt, 0)
    nuvens.scroll = (-st.velocidade * 0.1, 0)
    montes.scroll = (-st.velocidade * 0.3, 0)
    mato.scroll = (-st.velocidade * 0.7, 0)


@leave_playfield("pilar", "porta")
def saiu(coisa):
    coisa.destroy()


run()

        <p>Seta para cima levanta o nariz; seta para baixo o abaixa. Passe pelo vão dos pilares: cada par vale um ponto. O cenário passa em faixas, mais devagar as de longe. Batendo, o avião cai pegando fogo, tudo freia e a música abaixa; espaço recomeça.</p>
      `,
      recap: `
        <ul>
          <li><code>canvas.layers.create</code> — uma camada com nome; <code>scroll=</code> a faz andar sozinha, e <code>below="default"</code> a põe atrás do jogo.</li>
          <li><code>Endless</code> — enche a camada com a mesma imagem, uma depois da outra, sem fim; <code>height=</code> é o tamanho de cada uma.</li>
          <li>Parallax — o que está longe anda mais devagar: cada camada anda uma fração da velocidade do voo.</li>
          <li><code>.scroll</code> — a velocidade da camada muda a qualquer momento; com <code>chase</code>, tudo freia junto.</li>
          <li><code>Fire</code> com <code>center=lambda: …</code> — um efeito que segue um objeto.</li>
          <li><code>loops="forever"</code> e <code>fade_to</code> — música que repete, e o volume que muda devagar.</li>
        </ul>

        <p><strong>No próximo:</strong> uma paisagem que não se repete: nuvens e campos sorteados, árvores e casas soltas pelo caminho, e um mato na frente do avião.</p>
