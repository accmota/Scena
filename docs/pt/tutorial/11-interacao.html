      body: `
        <p>Este tutorial não é um jogo. É uma bancada para o mouse: cada passo apresenta um recurso, você escreve as linhas, roda e vê o recurso funcionando. As formas não fazem nada de interessante, e é de propósito: assim só o recurso aparece. São três scripts. Neste primeiro, clicar e passar o mouse por cima. No segundo, arrastar, soltar e uma grade. No terceiro, o mouse no canvas, sem objeto nenhum.</p>
        <p><strong>As formas.</strong> Um hexágono, um quadrado e um triângulo, os três no grupo <code>"formas"</code>. O quadrado cobre um pedaço do hexágono, também de propósito: é ali que vamos ver quem recebe o mouse quando duas formas estão no mesmo lugar.</p>
        <p><strong>Clique no grupo.</strong> No tutorial 1, o <code>@click</code> recebia as formas separadas por vírgula. Ele também aceita um grupo: <code>@click(group["formas"])</code> vale para cada forma do grupo, e o parâmetro <code>forma</code> recebe a que foi clicada. O grupo é lido no momento em que o <code>@click</code> é escrito; por isso as formas nascem antes dele.</p>
        <p><strong>Quem recebe.</strong> Rode e clique nas três: cada clique sorteia uma cor. Depois clique onde o quadrado cobre o hexágono: só o quadrado muda. O clique vai para um objeto só, o que está desenhado por cima. E quem nasce depois é desenhado por cima: no script, o quadrado vem depois do hexágono.</p>
