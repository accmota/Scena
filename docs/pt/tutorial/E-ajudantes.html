        <p>Este apêndice mostra os <strong>ajudantes</strong>: funções pequenas que fazem uma conta que aparece em todo jogo. Misturar dois valores (<code>lerp</code>), levar um número de uma escala para outra (<code>remap</code>), chegar perto de um alvo aos poucos (<code>chase</code>), dar folga a quem segue (<code>deadzone</code>). Cada seção é um programa curto: rode, mexa o mouse, mude os números. Os sorteios ficam no Apêndice B.</p>
        <p>O primeiro é <code>lerp(a, b, t)</code>: o valor que fica uma fração <code>t</code> do caminho entre <code>a</code> e <code>b</code>. Com <code>t = 0</code>, é o próprio <code>a</code>; com <code>t = 1</code>, é o <code>b</code>; com <code>0.5</code>, o meio; com <code>0.25</code>, um quarto do caminho, mais perto de <code>a</code>. O nome vem do inglês <em>linear interpolation</em> (interpolação linear: preencher o caminho reto entre dois valores).</p>
