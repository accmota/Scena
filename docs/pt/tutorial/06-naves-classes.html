      body: `
        <p>Novo script, o mesmo jogo: o jogo de naves do tutorial 05, inteiro, como ele terminou. Este tutorial quase não muda a tela. Ele <strong>reorganiza o código</strong>, e só no último passo a nave ganha uma peça nova.</p>
        <p><strong>Onde dói.</strong> Leia o <code>update</code>. Ele lê as setas, move a nave, segura a cerca, cria os tiros, move os tiros dos dois lados, move a frota e vira a frota nas bordas. Tudo o que acontece a cada quadro, com todo mundo, mora numa função só. E o <code>if nave:</code> está lá porque o <code>update</code> não sabe se a nave ainda existe: depois do <code>destroy</code>, ele precisa perguntar. Num jogo maior, com vidas, escudo e um chefe, essa função vira uma lista que ninguém consegue ler.</p>
        <p><strong>A ideia.</strong> Cada tipo de coisa do jogo vai carregar o próprio comportamento: o tiro sabe subir, o inimigo sabe pulsar e explodir, a nave sabe ler as setas. Para isso o Python tem as <strong>classes</strong>. Rode o script para lembrar do jogo; o próximo passo começa pelo mais simples, o tiro.</p>

        <p>O tiro é o mais simples: nasce e sobe. Hoje, nascer está no <code>update</code> (o <code>Sprite(…)</code> com a imagem, a altura e o grupo) e subir também (<code>group["tiros"].move_by</code>). Uma classe junta as duas coisas num lugar só.</p>

        </figure>

        <p><strong>O comportamento.</strong> Dentro da classe, <code>def on_update(self, dt)</code> é como o <code>update</code>: o Scena chama a cada quadro, mas uma vez para <em>cada</em> tiro. <code>self</code> quer dizer <strong>este aqui</strong>: o tiro que está sendo atualizado agora. <code>self.move_by(0, 640 * dt)</code> diz “este tiro sobe 640 pixels por segundo”. Com dez tiros na tela, o Scena chama dez vezes, cada vez com o seu <code>self</code>.</p>
