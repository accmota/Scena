            <p>Faça o teste: troque <code>def setup(self):</code> por <code>def __init__(self):</code> e rode. O programa para na criação. O círculo do Scena já tem o seu <code>__init__</code>: é ele que recebe <code>center</code> e <code>radius</code>, põe o círculo no mundo e o entrega ao Scena para ser desenhado e atualizado. O seu <code>__init__</code> tomou o lugar dele, e o seu não sabe o que é <code>center</code>. A mensagem de erro conta isso e já diz a saída: tire o <code>__init__</code> e escreva <code>def setup(self)</code>.</p>
            <p>Com o <code>setup</code>, você não mexe na montagem: o Scena monta o objeto inteiro e, quando ele está pronto, chama o seu <code>setup</code>. Daí a regra: numa classe sua, nunca <code>__init__</code>; o que o objeto faz ao nascer vai no <code>setup</code>.</p>
