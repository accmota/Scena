          body: `
            <p>Quem já leu classes de Python em outro lugar talvez tenha visto <code>def __init__(self):</code>, com dois sublinhados de cada lado. <code>__init__</code> (de <em>initialize</em>, iniciar) é o nome que o Python reserva para a função que monta o objeto, no instante do <code>Bolha(…)</code>. Parece o lugar certo para a velocidade. Não é, numa classe do Scena.</p>
            <p><strong>O teste.</strong> Troque <code>def setup(self):</code> por <code>def __init__(self):</code> e rode. O programa para na criação: <code>TypeError: Bolha() got center=, radius=, but Bolha.__init__ does not take them: it replaced Circle's own __init__, which does.</code> (“Bolha() recebeu center= e radius=, mas o Bolha.__init__ não os aceita: ele tomou o lugar do __init__ do Circle, que aceita”). O círculo do Scena já tem o seu <code>__init__</code>: é ele que recebe <code>center</code> e <code>radius</code>, põe o círculo no mundo e o entrega ao Scena para ser desenhado e atualizado. O seu <code>__init__</code> tomou o lugar dele, e o seu não sabe o que é <code>center</code>. A mensagem continua e já diz a saída: <code>Drop __init__ and write def setup(self)</code> (“tire o __init__ e escreva def setup(self)”).</p>
            <p>E se você tirar os parâmetros e escrever só <code>Bolha()</code>? Também para, por outro motivo. Com a linha do raio: <code>AttributeError: Bolha has no radius yet</code> (“a Bolha ainda não tem raio”), porque ninguém montou o círculo. Com uma linha que não lê nada (<code>self.velocidade = 100</code>): <code>TypeError: Bolha.__init__ never called Circle's own __init__, so this Bolha was not built</code> (“o Bolha.__init__ nunca chamou o do Circle, então esta Bolha não foi montada”). Sem esse aviso, o objeto nasceria vazio, sem lugar e fora da tela, e o Scena nunca chamaria o <code>on_update</code> dele.</p>
            <p><strong>Por isso o <code>setup</code>.</strong> Dá para consertar o <code>__init__</code>, chamando o do Scena por dentro (<code>super().__init__(**kwargs)</code>, como a mensagem diz), mas é uma linha a mais, fácil de esquecer. Com o <code>setup</code>, o Scena faz esse trabalho: monta o objeto inteiro e, quando ele está pronto, chama o seu <code>setup</code>. A regra: numa classe sua, nunca <code>__init__</code>; o que o objeto faz ao nascer vai no <code>setup</code>.</p>
            <p>No Guia: <a href="../guide/index.html#reagir-callbacks-entity">Callbacks da Entity</a>.</p>
