        <p>Este tutorial não é um jogo. É uma pequena máquina de formas ligadas umas às outras: um sol, uma lua, um fio, um ponteiro que gira. Cada passo acrescenta uma ligação, e você vê a mudança correr pela máquina. Desde o tutorial 02 você usa esse jeito de programar: o <code>@=</code> do placar, a <code>lambda</code> nas pontas das linhas do 03, o <code>Slider</code> do 04, as células do <code>st</code> no 07. Aqui as peças se juntam numa ideia só. O último passo junta essas ideias de novo, com exemplos, para você voltar a elas quando precisar.</p>
        <p><strong>A planilha.</strong> Pense numa planilha, como as do Excel ou do Google Planilhas. Cada casa (célula) tem um nome, como A1 ou B1, e guarda um número ou uma fórmula. Se B1 tem a fórmula <code>=A1/3</code>, ela mostra um terço do que está em A1. Troque o número de A1, e B1 refaz a conta sozinha. Ninguém manda B1 atualizar: a fórmula diz de onde vem o valor, e a planilha cuida do resto.</p>
