      body: `
        <p>Quase toda a arte e todo o som dos tutoriais vieram de sites que oferecem <em>assets</em> (recursos: imagens, animações, sons, músicas, fontes) para quem faz jogos. Este programa é uma vitrine: uma peça de cada site, com o nome dele embaixo, e um som no espaço.</p>
      `,

Text("OpenGameArt", top_center=(510, 310), font_size=22)
Text("itch.io", top_center=(690, 310), font_size=22)

`,
      after: `
        <p>De onde veio cada peça, e o que mais se acha em cada site:</p>
        <div class="tbl"><table><thead><tr><th>Site</th><th>O que tem</th><th>Licença</th></tr></thead><tbody>
          <tr><td><a href="https://www.kenney.nl">kenney.nl</a></td><td>Milhares de peças em pacotes que combinam entre si: naves, plataformas, cartas, botões, sons, fontes. As naves, os planetas e as bolas dos tutoriais. Cada pacote traz as peças em arquivos soltos e também numa folha com todas (Apêndice G).</td><td><strong>CC0</strong>: use como quiser, sem pedir nem dar crédito.</td></tr>
          <tr><td><a href="https://www.gameart2d.com">gameart2d.com</a></td><td>Personagens animados e cenários de plataforma, de um artista só: o ninja, o robô, o avião e os blocos de chão, um arquivo por quadro de animação.</td><td>A seção <em>Freebies</em> (grátis) é CC0; o resto é pago.</td></tr>
          <tr><td><a href="https://opengameart.org">opengameart.org</a></td><td>Um site comunitário: muita gente publica sprites, texturas, músicas e sons. Os tijolos da vitrine.</td><td>Cada peça tem a sua, escrita na página dela; a busca filtra pela licença.</td></tr>
          <tr><td><a href="https://itch.io/game-assets">itch.io</a></td><td>Uma loja de criadores independentes, com muitos pacotes grátis ou “pague quanto quiser”. O troféu vem do <em>Pixel Adventure</em>, da Pixel Frog.</td><td>Cada autor escreve a sua na página do pacote: leia antes.</td></tr>
          <tr><td><a href="https://craftpix.net">craftpix.net</a></td><td>Um catálogo grande de arte 2D, quase toda paga, com uma seção de grátis. A grama.</td><td>Licença própria, diferente das Creative Commons: leia a página de licença do site.</td></tr>
          <tr><td><a href="https://freesound.org">freesound.org</a></td><td>Sons gravados ou criados por milhares de pessoas: explosões, passos, portas, vozes, ambientes. Baixar pede uma conta grátis. Várias explosões dos tutoriais.</td><td>Cada som mostra a sua; a busca filtra por ela.</td></tr>
        </tbody></table></div>
        <p>Para fontes (as letras de um <code>Text</code>), dois sites a mais. O <a href="https://fonts.google.com">Google Fonts</a> tem mais de mil famílias, todas livres (SIL Open Font License ou Apache): pode usar e distribuir com o jogo, inclusive vendido; ponha o arquivo de licença do download junto da fonte. O <a href="https://www.1001fonts.com/video-game-fonts.html">1001fonts.com</a> abre, neste link, as fontes com cara de videogame (pixel, arcade, ficção científica), mas muitas são grátis só para uso pessoal: leia a licença antes de pôr num jogo que vai publicar.</p>
        <p>Prefira um pacote inteiro do mesmo autor a peças soltas de vários: o estilo combina. Antes de baixar, olhe a licença; ao baixar, anote de onde veio (a seção “Licenças” mostra como), e guarde o arquivo de licença que vem dentro do pacote, em geral <code>License.txt</code>.</p>
      `
    },
    {
      title: "CC0, BY, SA, NC",
      part: "Licenças",
      fresh: true,
      body: `
        <p>Um arquivo que você baixa tem dono: quem o fez. A <strong>licença</strong> é a permissão que o autor dá, por escrito, dizendo o que você pode fazer com ele. A maioria dos sites de assets usa as licenças <em>Creative Commons</em> (CC), montadas com algumas siglas:</p>
        <div class="tbl"><table><thead><tr><th>Sigla</th><th>O que pede</th></tr></thead><tbody>
          <tr><td><strong>CC0</strong> (zero)</td><td>nada: o autor abriu mão de tudo. Use, mude, publique e até venda, sem pedir nem dar crédito (dar crédito continua sendo gentil)</td></tr>
          <tr><td><strong>BY</strong> (“por”, de autoria)</td><td>crédito: o nome do autor, o nome ou o link da peça e a licença. CC-BY é a mais comum depois da CC0</td></tr>
          <tr><td><strong>SA</strong> (<em>share alike</em>, compartilhe igual)</td><td>se você <em>modificar</em> o arquivo (cortar um som, recolorir uma imagem), a versão modificada sai com a mesma licença. Só tocar o som no jogo não é modificar</td></tr>
          <tr><td><strong>NC</strong> (<em>non commercial</em>, não comercial)</td><td>nada vendido ou que dê dinheiro. Para um jogo de estudo, tudo bem; para um jogo que você talvez venda um dia, evite</td></tr>
          <tr><td><strong>ND</strong> (<em>no derivatives</em>, sem derivados)</td><td>use como está: sem cortar o som, sem recolorir a imagem</td></tr>
        </tbody></table></div>
        <p>Uma imagem achada numa busca qualquer, sem licença escrita, pertence ao autor: não pode ir para o seu jogo. Na dúvida, procure a mesma ideia num dos sites da seção anterior.</p>
        <p>O jeito mais simples de dar o crédito que o BY pede é uma tela de créditos no jogo. Este programa mostra uma, para o laser que toca no espaço e para a grama da vitrine.</p>

            <tr><td><strong>JPG</strong> (<code>.jpg</code>, <code>.jpeg</code>)</td><td>Fotos e pinturas, arquivos menores. Não tem transparência: serve para fundos, como o <code>Wallpaper</code> deste programa, e não para sprites.</td></tr>
