<div id="app"></div>
<script src="../../assets/tutorial/tutorial.js"></script>
<script>
Tutorial.mount({
  label: "Apêndice",
  n: "C",
  title: "Arte e som",
  steps: [
    {
      title: "Os sites",
      part: "Onde encontrar",
      body: `
        <p>Quase toda a arte e todo o som dos tutoriais vieram de sites que oferecem <em>assets</em> (recursos: imagens, animações, sons, músicas, fontes) para quem faz jogos:</p>
        <div class="tbl"><table><thead><tr><th>Site</th><th>O que tem</th></tr></thead><tbody>
          <tr><td><a href="https://www.kenney.nl">kenney.nl</a></td><td>Milhares de peças grátis em pacotes que combinam entre si: naves, plataformas, cartas, botões, sons, fontes. As naves, os planetas e as bolas dos tutoriais. Cada pacote traz as peças em arquivos soltos e também numa folha com todas (Apêndice G).</td></tr>
          <tr><td><a href="https://www.gameart2d.com">gameart2d.com</a></td><td>Personagens animados e cenários de plataforma, de um artista só: o ninja, o robô, o avião e os blocos de chão, um arquivo por quadro de animação. A seção <em>Freebies</em> é grátis; o resto é pago.</td></tr>
          <tr><td><a href="https://opengameart.org">opengameart.org</a></td><td>Um site comunitário: muita gente publica sprites, texturas, músicas e sons.</td></tr>
          <tr><td><a href="https://itch.io/game-assets">itch.io</a></td><td>Uma loja de criadores independentes, com muitos pacotes grátis ou “pague quanto quiser”.</td></tr>
          <tr><td><a href="https://craftpix.net">craftpix.net</a></td><td>Um catálogo grande de arte 2D, quase toda paga, com uma seção de grátis.</td></tr>
          <tr><td><a href="https://freesound.org">freesound.org</a></td><td>Sons gravados ou criados por milhares de pessoas: explosões, passos, portas, vozes, ambientes. Baixar pede uma conta grátis. Várias explosões dos tutoriais.</td></tr>
          <tr><td><a href="https://fonts.google.com">fonts.google.com</a></td><td>Mais de mil famílias de fontes (as letras de um <code>Text</code>), todas livres.</td></tr>
          <tr><td><a href="https://www.1001fonts.com/video-game-fonts.html">1001fonts.com</a></td><td>Neste link, as fontes com cara de videogame: pixel, arcade, ficção científica.</td></tr>
        </tbody></table></div>
        <p>Prefira um pacote inteiro do mesmo autor a peças soltas de vários: o estilo combina. Cada site diz, na página da peça, o que a licença permite: leia antes de baixar.</p>
      `
    },
    {
      title: "A pasta media",
      part: "Organizar os arquivos",
      fresh: true,
      body: `
        <p>Quando você escreve <code>Sprite("space/star_gold.png")</code>, o Scena procura o arquivo nesta ordem, e usa o primeiro que existir:</p>
        <ol>
          <li>ao lado do script: a pasta do arquivo <code>.py</code> que você rodou;</li>
          <li>na pasta <code>media</code> ao lado do script;</li>
          <li>na pasta de onde o programa foi rodado (a pasta atual do terminal).</li>
        </ol>
        <p>Um caminho completo, como <code>"/Users/ana/jogos/nave.png"</code>, vale só para aquele arquivo. A mesma busca serve para tudo que abre um arquivo pelo nome: <code>Sprite</code>, <code>Wallpaper</code>, <code>Svg</code>, <code>Sheet</code>, <code>play_sound</code> e a <code>font=</code> de um texto.</p>
        <p>É por isso que os tutoriais pedem para copiar a pasta <code>media</code> dos exemplos para junto dos seus scripts. Guarde o que você baixar do mesmo jeito, uma subpasta por pacote:</p>
        <ul>
          <li><code>meu_jogo.py</code></li>
          <li><code>media/</code>
            <ul>
              <li><code>space/</code> — um pacote do Kenney</li>
              <li><code>k-rolling-ball/</code> — outro pacote</li>
              <li><code>audio/</code> — os sons</li>
            </ul>
          </li>
        </ul>
        <p>O programa mostra três imagens de três subpastas, com o nome de cada uma escrito embaixo.</p>
      `,
      code: `from scena import *

init(width=900, height=500, title="Pastas")
Wallpaper("dark navy")

Sprite("space/star_gold.png", height=90, center=(180, 290))
Sprite("k-rolling-ball/ball_blue_large.png", height=90, center=(450, 290))
Sprite("robot/Idle (1).png", height=120, center=(720, 290))

Text("space/star_gold.png", top_center=(180, 200), font_size=18)
Text("k-rolling-ball/ball_blue_large.png", top_center=(450, 200), font_size=18)
Text("robot/Idle (1).png", top_center=(720, 200), font_size=18)

run()
`,
      notes: [
        {
          at: "Sprite(\"space/star_gold.png\"",
          text: "O nome leva a subpasta: o Scena procura <code>media/space/star_gold.png</code>. Ele não entra sozinho nas subpastas atrás de um <code>star_gold.png</code>, então a subpasta tem que estar no nome."
        },
        {
          at: "Sprite(\"robot/Idle (1).png\"",
          text: "Letra por letra igual ao arquivo, com maiúsculas, espaços e parênteses. No Mac e no Windows, <code>idle (1).png</code> ainda abre, mas com um aviso no console: no Linux o arquivo não seria achado. Se for renomear, prefira nomes curtos, sem acento e sem espaço."
        }
      ],
      after: `
        <p>Troque <code>star_gold</code> por <code>star_gld</code> e rode. Um nome errado não para o jogo: no lugar da imagem aparece um quadriculado (num som, silêncio), e um aviso no console diz qual arquivo faltou (Apêndice A, “Avisos”).</p>
        <details class="ask"><summary>Há um <code>space/star_gold.png</code> ao lado do script e outro em <code>media/space/star_gold.png</code>. Qual aparece?</summary><p>O de ao lado do script: a busca para no primeiro que acha, e a pasta do script vem antes da <code>media</code>. Assim dá para trocar uma imagem do pacote por uma sua sem mexer na pasta <code>media</code>.</p></details>
      `
    },
    {
      title: "PNG, JPG, sons e fontes",
      part: "Formatos",
      fresh: true,
      body: `
        <p>O formato é o tipo do arquivo, e aparece no fim do nome, depois do ponto. Este programa usa quatro: o fundo é um JPG, a nave um PNG, o título usa uma fonte, e as teclas 1 e 2 tocam dois sons.</p>
      `,
      code: `from scena import *

init(width=1000, height=600, title="Formatos")
Wallpaper("images/bg3.jpg")

Sprite("space/playerShip1_red.png", height=120, center=(500, 280))
Text("FORMATOS", top_center=(500, 560), font="space/kenvector_future.ttf", font_size=56)
Text("1: som OGG   2: som WAV", top_left=(20, 50), font_size=22)


def update(dt):
    if keyp.once("1"):
        play_sound("space/sfx_laser1.ogg")
    if keyp.once("2"):
        play_sound("synth/coin.wav")


run()
`,
      notes: [
        {
          at: "font=\"space/kenvector_future.ttf\"",
          text: "Uma fonte (as letras de um texto) é um arquivo também. O pacote de naves do Kenney traz esta."
        }
      ],
      after: `
        <p>Os formatos que o Scena abre:</p>
        <div class="tbl"><table>
          <thead><tr><th>Formato</th><th>Para quê</th></tr></thead>
          <tbody>
            <tr><td><strong>PNG</strong> (<code>.png</code>)</td><td>O formato dos sprites. Guarda transparência: em volta da nave não há fundo, e o céu aparece por trás.</td></tr>
            <tr><td><strong>JPG</strong> (<code>.jpg</code>, <code>.jpeg</code>)</td><td>Fotos e pinturas, arquivos menores. Não tem transparência: serve para fundos, como o <code>Wallpaper</code> deste programa, e não para sprites.</td></tr>
            <tr><td><strong>SVG</strong> (<code>.svg</code>)</td><td>Desenho feito de formas, e não de pixels, nítido em qualquer tamanho. Abre com <code>Svg("arquivo.svg")</code>, no lugar de <code>Sprite</code>.</td></tr>
            <tr><td><strong>Sons</strong> (<code>.wav</code>, <code>.ogg</code>, <code>.mp3</code>, <code>.flac</code>)</td><td>WAV é comum nos efeitos curtos; OGG e MP3, menores, nas músicas.</td></tr>
            <tr><td><strong>Fontes</strong> (<code>.ttf</code>, <code>.otf</code>)</td><td>As letras de um texto, com <code>font=</code>.</td></tr>
          </tbody>
        </table></div>
        <p>Um personagem animado vem em vários arquivos, numa faixa ou num atlas. Os jeitos de carregar cada um, com figuras, e a forma com que uma imagem colide estão no Apêndice G.</p>
      `
    }
  ]
});
</script>
</body>
