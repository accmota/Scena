      title: "Uma vitrine",
      part: "Onde encontrar",
      body: `
        <p>Quase toda a arte e todo o som dos tutoriais vieram de sites que oferecem <em>assets</em> (recursos: imagens, animações, sons, músicas, fontes) para quem faz jogos. Este programa é uma vitrine: uma peça de cada site, com o nome dele embaixo. Espaço toca um som. Os sites, com o que se acha em cada um:</p>
        <ul>
          <li><a href="https://www.kenney.nl">kenney.nl</a> — o Kenney publica milhares de peças em pacotes que combinam entre si: naves, plataformas, cartas, botões de interface, sons, fontes. Tudo em <strong>CC0</strong>: use como quiser, sem pedir nem dar crédito. As naves, os planetas e as bolas dos tutoriais vêm daqui. Os pacotes trazem cada peça num arquivo e também uma folha com todas (o Apêndice G mostra como usar cada jeito).</li>
          <li><a href="https://www.gameart2d.com">gameart2d.com</a> — personagens animados e cenários de plataforma, de um artista só. A seção <em>Freebies</em> (grátis) é CC0; o resto é pago. O ninja, o robô, o avião e os blocos de chão dos tutoriais vêm daqui, um arquivo por quadro de animação.</li>
          <li><a href="https://opengameart.org">opengameart.org</a> — um site comunitário: muita gente diferente publica sprites, texturas, músicas e sons. Cada peça tem a sua licença, escrita na página dela (CC0, CC-BY, CC-BY-SA e outras). A busca deixa filtrar pela licença. Os tijolos desta vitrine vêm daqui.</li>
          <li><a href="https://itch.io/game-assets">itch.io</a> — uma loja de criadores independentes, com uma seção enorme de assets, muitos grátis ou “pague quanto quiser”. Cada autor escreve a sua licença na página do pacote: leia antes. O troféu vem do pacote <em>Pixel Adventure</em>, da Pixel Frog (CC0).</li>
          <li><a href="https://craftpix.net">craftpix.net</a> — um catálogo grande de arte 2D, quase toda paga, com uma seção de grátis. Tem licença própria, diferente das Creative Commons: leia a página de licença do site antes de usar.</li>
          <li><a href="https://freesound.org">freesound.org</a> — sons gravados ou criados por milhares de pessoas: explosões, passos, portas, vozes, ambientes. Baixar pede uma conta (grátis). Cada som mostra a licença; a busca filtra por ela. Várias explosões dos tutoriais vêm daqui.</li>
        </ul>
        <p>Para fontes (as letras de um <code>Text</code>), dois sites a mais:</p>
        <ul>
          <li><a href="https://fonts.google.com">fonts.google.com</a> — o Google Fonts, com mais de mil famílias. Todas são livres (SIL Open Font License ou Apache): pode usar e distribuir com o jogo, inclusive vendido. O download traz o arquivo de licença; ponha-o junto da fonte.</li>
          <li><a href="https://www.1001fonts.com/video-game-fonts.html">1001fonts.com</a> — uma coleção grande; este link abre as fontes com cara de videogame: pixel, arcade, ficção científica. Cada fonte mostra a licença na página dela, e muitas são grátis só para uso pessoal: leia antes de pôr num jogo que vai publicar.</li>
        </ul>
        <p><strong>Dicas.</strong> Prefira um pacote inteiro do mesmo autor a peças soltas de vários: o estilo combina. Antes de baixar, olhe a licença; ao baixar, anote de onde veio (a seção “Licenças” mostra como). E veja o arquivo de licença que vem dentro do pacote, em geral <code>License.txt</code>.</p>
      `,

`
    },
    {
      title: "CC0, BY, SA, NC",
      part: "Licenças",
      fresh: true,
      body: `
        <p>Um arquivo que você baixa tem dono: quem o fez. A <strong>licença</strong> é a permissão que o autor dá, por escrito, dizendo o que você pode fazer com ele. A maioria dos sites de assets usa as licenças <em>Creative Commons</em> (CC), que são montadas com algumas siglas:</p>
        <ul>
          <li><strong>CC0</strong> (zero) — o autor abriu mão de tudo. Use, mude, publique e até venda, sem pedir nem dar crédito. Dar crédito continua sendo gentil.</li>
          <li><strong>BY</strong> (“por”, de autoria) — use à vontade, mas dê crédito: o nome do autor, o nome ou o link da peça e a licença. CC-BY é a mais comum depois da CC0.</li>
          <li><strong>SA</strong> (<em>share alike</em>, compartilhe igual) — se você <em>modificar</em> o arquivo (cortar um som, recolorir uma imagem), a versão modificada tem que sair com a mesma licença. Só tocar o som no jogo não é modificar.</li>
          <li><strong>NC</strong> (<em>non commercial</em>, não comercial) — não pode ser usado em nada vendido ou que dê dinheiro. Para um jogo de estudo, tudo bem; para um jogo que você talvez venda um dia, evite.</li>
          <li><strong>ND</strong> (<em>no derivatives</em>, sem derivados) — use como está: não pode ser modificado, nem cortando o som, nem recolorindo a imagem.</li>
        </ul>
        <p><strong>Sem licença, não.</strong> Uma imagem achada numa busca qualquer, sem licença escrita, pertence ao autor: não pode ir para o seu jogo. Na dúvida, procure a mesma ideia num dos sites da seção anterior.</p>
        <p><strong>A tela de créditos.</strong> O jeito mais simples de dar o crédito que o BY pede é uma tela de créditos no jogo, ou um arquivo de texto que vai junto com ele. Este programa toca, no espaço, o laser <code>audio/laser4.wav</code>, que é CC-BY, e mostra o crédito dele e o da grama da vitrine: autor, link, licença.</p>
        <p><strong>O arquivo de créditos.</strong> Ao baixar um arquivo que não é CC0, anote na hora, num <code>creditos.txt</code> ao lado do jogo: o nome do arquivo, o autor, o link e a licença. Depois de cinquenta arquivos, ninguém lembra de onde veio cada um. A tela de créditos sai pronta desse arquivo.</p>
      `,

    {

      body: `
        <p><strong>Onde o Scena procura.</strong> Quando você escreve <code>Sprite("space/star_gold.png")</code>, o Scena procura o arquivo primeiro ao lado do seu script e depois numa pasta chamada <code>media</code> ao lado dele. Por isso os tutoriais pedem que você copie a pasta <code>media</code> dos exemplos para junto dos seus scripts. Faça o mesmo com o que você baixar:</p>
        <ul>
          <li><code>meu_jogo.py</code></li>
          <li><code>creditos.txt</code></li>
          <li><code>media/</code>
            <ul>
              <li><code>space/</code> — um pacote do Kenney, com o <code>License.txt</code> dele</li>
              <li><code>k-rolling-ball/</code> — outro pacote</li>
              <li><code>audio/</code> — os sons</li>
            </ul>
          </li>
        </ul>
        <p><strong>Uma subpasta por pacote.</strong> Cada pacote baixado vai numa subpasta própria, com o arquivo de licença que veio nele. No código, o nome leva a subpasta: <code>"space/star_gold.png"</code>. O Scena não procura sozinho dentro das subpastas, então ela tem que estar no nome. O programa mostra três imagens de três subpastas, cada uma com o nome escrito embaixo.</p>
        <p><strong>Nomes.</strong> O nome no código tem que ser igual ao do arquivo, letra por letra, com maiúsculas, espaços e parênteses: <code>"robot/Idle (1).png"</code>. Manter os nomes originais do pacote ajuda a achar o crédito depois; se for renomear, prefira nomes curtos, sem acento e sem espaço. Um nome errado não para o jogo: aparece um quadriculado no lugar da imagem (ou silêncio, no som) e um aviso (Apêndice A, “Avisos”).</p>

    {
      title: "PNG, JPG, sons e fontes",

      fresh: true,
      body: `
        <p>O formato é o tipo do arquivo, e aparece no fim do nome, depois do ponto. O Scena abre estes:</p>
        <div class="tbl"><table>
          <thead><tr><th>Formato</th><th>Para quê</th></tr></thead>
          <tbody>
            <tr><td><strong>PNG</strong> (<code>.png</code>)</td><td>O formato dos sprites. Guarda transparência: em volta da nave não há fundo, e o céu aparece por trás.</td></tr>
            <tr><td><strong>JPG</strong> (<code>.jpg</code>, <code>.jpeg</code>)</td><td>Fotos e pinturas, arquivos menores. Não tem transparência: serve para fundos, como o <code>Wallpaper</code> deste programa, e não para sprites.</td></tr>
            <tr><td><strong>SVG</strong> (<code>.svg</code>)</td><td>Desenho feito de formas, e não de pixels, nítido em qualquer tamanho. Abre com <code>Svg("arquivo.svg")</code>, no lugar de <code>Sprite</code>.</td></tr>
            <tr><td><strong>Sons</strong> (<code>.wav</code>, <code>.ogg</code>, <code>.mp3</code>, <code>.flac</code>)</td><td>WAV é comum nos efeitos curtos; OGG e MP3, menores, nas músicas.</td></tr>
            <tr><td><strong>Fontes</strong> (<code>.ttf</code>, <code>.otf</code>)</td><td>As letras de um texto: <code>Text(…, font="space/kenvector_future.ttf")</code>. O pacote de naves do Kenney traz esta.</td></tr>
          </tbody>
        </table></div>
        <p>Rode: o fundo é um JPG, a nave um PNG, o título usa a fonte do Kenney, e as teclas 1 e 2 tocam um OGG e um WAV.</p>
        <p><strong>Animações e folhas.</strong> Um personagem animado vem em vários arquivos, numa faixa ou num atlas. Os jeitos de carregar cada um, com figuras, e a forma com que uma imagem colide estão no Apêndice G.</p>

    },
    {
      title: "Efeitos e música",
      part: "Sons",
      fresh: true,
      body: `
        <p><code>play_sound("…")</code> (tocar som) toca um arquivo uma vez e pronto: não precisa criar nada antes. Os sons de um jogo são de dois tipos.</p>
        <p><strong>Efeitos.</strong> Sons curtos que respondem a alguma coisa: o pulo, a moeda, a explosão. Teclas 1, 2 e 3. <code>pitch=</code> (altura) muda o tom: 1 é o original, acima de 1 fica mais agudo e mais rápido. Sortear um pouco o tom a cada vez (<code>uniform(0.9, 1.1)</code>) evita que o mesmo som, repetido, canse o ouvido. <code>volume=</code> deixa um som mais baixo (0.5 é metade).</p>
        <p><strong>Música.</strong> Um som longo, que repete: <code>loops="forever"</code> (repetições: para sempre). A tecla M liga a música. <code>name="musica"</code> dá um nome à vaga dela: apertar M de novo começa a música de novo no lugar da que tocava, em vez de somar uma segunda por cima.</p>
        <p>Os tutoriais 07 (o estrondo da explosão), 22 (as notas de um piano) e 23 (a sua voz) usam sons em jogos. Para o volume de tudo e uma tecla de mudo, veja o Apêndice B, “Volume”.</p>
