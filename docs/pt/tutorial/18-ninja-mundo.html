        <p>O ninja do 17 corre, pula e pisa no chão, mas não tem o que fazer. Neste tutorial, ele ganha um mundo para viver: um buraco com água, estrelas para pegar, robôs que patrulham, kunais (as facas de arremesso do ninja) para jogar e três vidas.</p>

for i in range(13):

def plataforma(x, y):

class Heroi(Sprite, source=ninja, group="heroi", hitbox_shape="rect"):
    def setup(self):
        self.vel = Vec2(0, 0)

    def on_update(self, dt):
        if keyp("LEFT"):
            self.vel.x = -280
            self.flip_x = True
        elif keyp("RIGHT"):
            self.vel.x = 280
            self.flip_x = False
        else:
            self.vel.x = 0

        no_chao = "bottom" in self.touching_sides
        if keyp.once("UP") and no_chao:
            self.vel.y = 900
            play_sound("synth/jump.wav")

        self.vel.y -= 2200 * dt
        self.move_by(self.vel.x * dt, self.vel.y * dt)

        if not no_chao:
            self.play("pulando")
        elif self.vel.x != 0:
            self.play("correndo")
        else:
            self.play("parado")

        <p><strong>O buraco.</strong> O chão agora vem em dois pedaços, com um vão de duas peças entre eles. Nas beiradas do vão, duas peças com o lado de terra à mostra: <code>3.png</code> fecha o pedaço da esquerda, <code>1.png</code> abre o da direita. Lá embaixo, duas peças de água (<code>17.png</code>), mais baixas que o chão. Uma terceira plataforma, lá no alto, completa o cenário.</p>
        <p><strong>Quem fica na frente.</strong> O que nasce depois é desenhado na frente. A árvore, as moitas, a placa e o cogumelo nascem antes do chão: ficam atrás de tudo, só de enfeite, sem grupo e sem colisão. A água nasce depois do ninja, então o ninja que cai afunda <em>atrás</em> dela.</p>
