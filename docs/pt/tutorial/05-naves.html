        <p>Novo script: um jogo de naves simples. Uma nave embaixo, uma frota inimiga em cima, tiros dos dois lados. Este primeiro passo só junta o que você já sabe: um sprite e as setas.</p>
        <p>A nave nasce em <code>center=(500, 70)</code>, no meio da largura e perto da borda de baixo. Só as setas esquerda e direita: como nos jogos de nave clássicos de fliperama, a nave anda numa linha só e o perigo vem de cima. <code>340 * dt</code> são 340 pixels por segundo. A imagem vem de <code>media/space/</code>, ao lado do script. O fundo é o preto de sempre: o céu e o brilho da nave têm passo próprio, daqui a pouco.</p>
        <p>Rode e segure uma seta até o fim: a nave sai da janela e some. É o assunto do próximo passo.</p>

            <p>O <strong>fundo</strong> é desenhado primeiro, atrás de tudo o que o jogo cria. Ele tem duas camadas. A <em>base</em> é sempre uma só: uma cor, um degradê, um céu pronto ou uma imagem, com <code>Wallpaper</code> ou <code>SkyGradient</code>. Criar outra base troca a anterior. Por cima dela vêm os <em>extras</em>, campos animados que o Scena calcula sozinho e que não acabam nunca: <code>Stars</code>, <code>Stardust</code>, <code>Nebuladust</code>, <code>Borealis</code>, <code>Clouds</code>. Os extras se empilham, na ordem em que nascem, e cada um aparece assim que é criado.</p>
            <p>Os extras dividem os mesmos parâmetros. <code>color</code> é a cor; <code>amount</code> (quantidade) é o quanto aparece; <code>alpha</code> é a transparência; <code>speed</code> (velocidade) é o ritmo da animação; <code>scroll</code> é quanto o campo anda sozinho, em pixels por segundo; <code>pan_response</code> é quanto ele acompanha a câmera, e 0 o prende à tela. Para mudar ou tirar um extra depois, guarde o que a linha devolve: <code>nuvens = Clouds()</code>, e depois <code>nuvens.remove()</code>.</p>
