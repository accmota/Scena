      body: `
        <p>Novo script: um Galaga simples. Uma nave embaixo, uma frota inimiga em cima, tiros dos dois lados. Este primeiro passo só junta o que você já sabe: um sprite e as setas.</p>
        <p>A nave nasce em <code>center=(500, 70)</code>, no meio da largura e perto da borda de baixo. Só as setas esquerda e direita: como no Galaga, a nave anda numa linha só e o perigo vem de cima. <code>340 * dt</code> são 340 pixels por segundo. <code>glow</code> liga o brilho em volta da imagem, como no tutorial 01. A imagem vem de <code>media/space/</code>, ao lado do script.</p>
        <p>Rode e segure uma seta até o fim: a nave sai da janela e some. É o assunto do próximo passo.</p>
