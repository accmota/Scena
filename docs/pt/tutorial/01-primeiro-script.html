    {
      title: "A janela",
      body: `
        <p>Um script Scena é um arquivo Python comum: você escreve as linhas, salva e roda, e o Scena cuida da janela, do desenho, do teclado e do mouse. O primeiro tem três linhas, e as três vão estar em todo script que você escrever.</p>
      `,
      code: `from scena import *

init(width=1000, height=700, title="Mouse e teclado")

run()
`,
      notes: [
        {
          at: "from scena import *",
          text: "Traz para o seu arquivo tudo o que o Scena oferece: formas, cores, teclado, mouse. O <code>*</code> quer dizer “tudo”; graças a ele, nomes como <code>Circle</code> se escrevem direto, sem prefixo."
        },
        {
          at: "init(",
          text: "<code>init</code> (de <em>initialize</em>, iniciar) prepara a janela, mas ainda não a abre. <code>width</code> (largura) e <code>height</code> (altura) dão o tamanho da área de desenho; <code>title</code> (título) é o texto na barra da janela."
        },
        {
          at: "run()",
          text: "<code>run</code> (rodar) abre a janela e põe o jogo para andar: muitas vezes por segundo, o Scena lê o teclado e o mouse e redesenha a tela, até você fechar a janela. Por isso <code>run()</code> é sempre a última linha, e tudo o que você criar vem antes dela."
        }
      ],
      after: `
        <p>Copie, salve como <code>primeiro.py</code> e rode (<code>python primeiro.py</code>). Abre uma janela vazia, de fundo preto, com o título “Mouse e teclado”. Feche a janela para encerrar o script.</p>
        <p>Dentro dos parênteses do <code>init</code>, cada informação vai como <code>nome=valor</code>, separada da seguinte por uma vírgula: <code>width=1000</code> quer dizer “a largura é 1000”. Com o nome escrito, a ordem não importa, e o que você não escreve fica num valor padrão que o Scena escolhe.</p>
        <details class="ask"><summary>A janela mede 1000 pixels do seu monitor?</summary><p>Não. Os 1000 × 700 são a régua com que você vai posicionar tudo, e o Scena ajusta a janela à sua tela: num monitor grande ou pequeno, o desenho sai igual. Quando um tutorial disser que algo tem 80 pixels, entenda 80 unidades dessa régua.</p></details>
      `,

        {
          note: "No lugar da linha do <code>init</code>: outra área de desenho, mais larga que alta, e outro título. É só isto que muda de uma janela para outra.",
