      title: "A janela",
      body: `
        <p>Um script Scena é um arquivo Python comum: você escreve as linhas, salva e roda. O Scena cuida da janela, do desenho, do teclado e do mouse. Este primeiro script tem só três linhas, e as três vão estar em todo script que você escrever daqui em diante.</p>
        <p><strong>O import.</strong> <code>from scena import *</code> traz para o seu arquivo tudo que o Scena oferece: formas, cores, teclado, mouse. O <code>*</code> quer dizer “tudo”. Graças a ele, nomes como <code>Circle</code> ou <code>keyp</code> se escrevem direto, sem prefixo.</p>
        <p><strong>O tamanho.</strong> <code>init</code> (de <em>initialize</em>, iniciar) prepara a janela, mas ainda não a abre. <code>width</code> (largura) e <code>height</code> (altura) dão o tamanho da área de desenho, e <code>title</code> (título) é o texto na barra da janela. Os 1000 × 700 não são pixels do monitor: são a régua com que você vai posicionar tudo, e o Scena ajusta a janela à sua tela. Num monitor grande ou pequeno, o desenho sai igual.</p>
        <p><strong>Nome e valor.</strong> Dentro dos parênteses, cada informação vai como <code>nome=valor</code>: <code>width=1000</code> quer dizer “a largura é 1000”. Com o nome escrito, a ordem não importa, e o que você não escreve fica num valor padrão que o Scena escolhe. As vírgulas separam uma informação da outra.</p>
        <p><strong>O laço.</strong> <code>run()</code> (rodar) abre a janela e põe o jogo para andar: muitas vezes por segundo, o Scena lê o teclado e o mouse e redesenha a tela. Ele só sai desse laço quando você fecha a janela. Por isso <code>run()</code> é sempre a última linha, e tudo que você criar vem antes dela.</p>
        <p>Copie, salve como <code>primeiro.py</code> e rode (<code>python primeiro.py</code>). Deve abrir uma janela vazia, de fundo preto, com o título “Mouse e teclado”. Feche a janela para encerrar o script.</p>
      `,

run()

        <p><strong>O visual.</strong> <code>.visual</code> escolhe como a forma é desenhada. <code>Neon()</code> transforma o triângulo num tubo de neon aceso, no dourado dele. <code>Halo("blue")</code> (auréola) desenha o retângulo como uma casca luminosa; a cor entre parênteses tinge a luz de azul. Cada forma tem um visual só: escrever outro <code>.visual</code> troca o anterior.</p>

      body: `
        <p>Até aqui, tudo fica parado. Para mover a estrela, o script precisa de um lugar que rode o tempo todo, enquanto a janela está aberta.</p>
        <p><strong>A função update.</strong> Lembra do laço do <code>run()</code>? A cada volta, o Scena desenha uma imagem nova da tela, um frame (quadro), uns 60 por segundo. Se o script tem uma função chamada <code>update</code> (atualizar), o Scena a chama uma vez por frame, antes de desenhar. Você não chama <code>update</code> em lugar nenhum: basta o nome certo. O que estiver dentro dela acontece 60 vezes por segundo.</p>
        <p><strong>O dt.</strong> Em cada chamada, o Scena entrega um número, <code>dt</code> (de <em>delta time</em>, diferença de tempo): quantos segundos se passaram desde o frame anterior. A 60 frames por segundo, é cerca de 0,017.</p>
        <p><strong>O passo.</strong> <code>move_by</code> (mover por) desloca a estrela a partir de onde ela está. O primeiro número é quanto andar em x (positivo vai para a direita, negativo para a esquerda); o segundo, em y (positivo sobe, negativo desce). Aqui, <code>200 * dt</code> em x e <code>0</code> em y: a cada frame, um passinho para a direita. Em um segundo, os passinhos somam 200, em qualquer computador. Numa máquina lenta há menos frames, mas cada <code>dt</code> é maior, e a soma dá o mesmo. É por isso que se multiplica por <code>dt</code>: <code>200 * dt</code> quer dizer “200 por segundo”.</p>

        <p><strong>As direções.</strong> O que muda de um <code>if</code> para outro é o sinal e a posição do número no <code>move_by</code>. Esquerda é x negativo. Para cima, o número vai no y, positivo; para baixo, no y, negativo. São quatro <code>if</code> separados, e não <code>elif</code>: com duas setas apertadas, as duas valem no mesmo frame, e a estrela anda na diagonal.</p>

estrela = Sprite("space/star_gold.png", size=48, center=(500, 200))


def update(dt):
    VELOCIDADE = 400
    if keyp("LEFT"):
        estrela.move_by(-VELOCIDADE * dt, 0)
    if keyp("RIGHT"):
        estrela.move_by(VELOCIDADE * dt, 0)
    if keyp("UP"):
        estrela.move_by(0, VELOCIDADE * dt)
    if keyp("DOWN"):

run()
