class Heroi(Sprite, source=folha, frame="playerShip1_red.png", height=45, group="heroi"):
    def setup(self):
        self.glow = True
        self.propulsor = Jet(origin=lambda: (self.center.x, self.center.y - 22),
                             angle=270, length=40, width=16, amount=2)
        self.escudo = Escudo(center=lambda: self.center)
        self.escudo.active = False

    def on_update(self, dt):
        if keyp("LEFT"):
            self.move_by(-340 * dt, 0)
        if keyp("RIGHT"):
            self.move_by(340 * dt, 0)

            Tiro(center=(self.center.x, self.center.y + 28))
            play_sound("audio/laser4.wav")

    @collide_with("tiros_inimigos")
    def atingido(self, tiro):
        tiro.destroy()
        if not ready("dano", 1.5):
            return
        st.vidas -= 1
        canvas.shake(8)
        if st.vidas > 0:
            self.blink(1.5)
            play_sound("audio/sfx-hit-2.wav")
        else:
            canvas.flash(0.4)
            canvas.explosion_at(self, amount=1.2)
            Fire(center=self.center, radius=30)
            Text(text="FIM DE JOGO", center=(500, 400), font_size=48)
            play_sound("audio/gameover.wav")
            self.destroy()

    def pegou(self, poder):
        poder.destroy()
        self.pop()
        play_sound("audio/fx1.wav")
        st.energia = 100

    @on_change(lambda self: st.energia)
    def energia_mudou(self):
        self.escudo.active = st.energia > 0
        if st.energia == 0:
            canvas.burst_at(self, radius=70, rings=True)
            play_sound("audio/impactBell_heavy_000.ogg")

    def on_destroy(self):
        self.propulsor.destroy()
        self.escudo.destroy()

        <p>Um <strong>ato</strong> (<code>Act</code>) é uma parte do jogo: o título, a fase, o fim de jogo. Ele se escreve como uma classe, <code>class Fase(Act)</code>, e o seu <code>setup</code> monta aquela parte: aqui, o placar, as vidas, a barra de energia, a nave e a frota. São as mesmas linhas de antes, agora dentro do <code>setup</code>, um degrau para a direita.</p>
        <p><strong>O começo.</strong> <code>run(Fase)</code> no lugar do <code>run()</code>: o jogo começa pelo ato <code>Fase</code>. Quem monta o ato é o Scena, chamando o <code>setup</code>; ninguém escreve <code>Fase()</code>.</p>
        <p><strong>O palco e o ato.</strong> O que o topo do arquivo cria fica o jogo todo: o fundo, as estrelas, os efeitos de tela, as folhas. Esse é o <strong>palco</strong>. O que nasce depois, no <code>setup</code> do ato ou por qualquer código enquanto ele está valendo (um tiro, uma explosão, o chefe), é do ato. As classes ficam no topo: são só moldes.</p>
        <p><strong>O que é da fase vai para a fase.</strong> O <code>update</code> que balançava a frota virou o <code>on_update</code> da fase: um <code>update</code> no topo rodaria em todo ato, e quem balança a frota é a fase. O <code>@when</code> do chefe também entrou na classe, com <code>lambda self:</code>, como os da nave. No topo, ele valeria em todo ato: num ato sem frota, como o fim de jogo que vem daqui a pouco, o grupo vazio chamaria um chefe. Dentro da fase, ele liga quando ela começa e sai com ela. O <code>@leave_playfield</code> fica no topo: ele só apaga tiros, e onde não há tiros não faz nada.</p>
        <p><strong>A nave sem nome.</strong> A variável <code>nave</code> sumiu; <code>Heroi(center=(500, 70))</code> basta. Ninguém lia a variável: os inimigos acham a nave pelo grupo, com o <code>nearest</code> do 24.</p>
        <p>Rode: o jogo é o mesmo, e nada mudou na tela.</p>
