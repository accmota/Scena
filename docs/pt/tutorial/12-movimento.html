        <p>Até aqui, uma viagem começada ia até o fim. Mas dá para mexer nela no meio do caminho: o <code>move_to</code> com <code>time=</code> ou <code>speed=</code> devolve um <strong>controle</strong> da viagem. Com ele na mão, você pode cancelar a viagem, pausá-la, perguntar se acabou.</p>

      code: `from scena import *

init(width=1000, height=700, title="Movimento")

    if nave.viagem:

        <ul>
          <li><code>move_to(x, y)</code> — sem tempo, coloca na hora; com <code>time=</code> ou <code>speed=</code>, viaja, e o Scena anda a cada quadro.</li>
          <li><code>time=</code> e <code>speed=</code> — a mesma duração para toda viagem, ou a mesma velocidade.</li>
          <li><code>ease=</code> — o ritmo dentro da viagem: <code>"ease_in_out"</code> arranca e freia.</li>

          <li>O controle da viagem — o que o <code>move_to</code> devolve: <code>cancel()</code>, <code>pause()</code>, <code>resume()</code>.</li>
          <li><code>approach</code> — um passo por quadro na direção de um alvo que pode andar.</li>
