nave = Sprite("space/playerShip1_red.png", width=60, center=(500, 350), art_angle=90)
nave.viagem = None


def pousou():
    nave.viagem = None
    alvo.visible = False


def parar():
    if nave.viagem:
        nave.viagem.cancel()
        nave.viagem = None
    alvo.visible = False


def on_mouse_click(x, y, button):
    parar()
    alvo.center = (x, y)
    alvo.visible = True
    nave.viagem = nave.move_to(x, y, speed=400, ease="ease_in_out", face=True, on_done=pousou)


def update(dt):
    if keyp.once("SPACE"):
        parar()


run()
