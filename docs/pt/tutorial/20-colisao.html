        <p>Este tutorial não é um jogo. É um laboratório para ver de perto o que a colisão sabe fazer além do que os jogos usaram. Até aqui, a colisão foi uma <strong>regra</strong> que dispara quando duas coisas se tocam (<code>@collide</code>, no 02) ou que não deixa uma atravessar a outra (<code>resolve</code>, no 10). Aqui você vê as três fases de um toque (começou, continua, acabou) e as <strong>perguntas</strong>: quem está neste ponto, quem está nesta área, o que esta linha atinge primeiro.</p>

heroi = Circle(center=(120, 560), radius=22, color="coral", group="heroi")
heroi.velocidade = 260
resolve("heroi", "caixa")


def update(dt):
    passo = heroi.velocidade * dt
    if keyp("LEFT"):
        heroi.move_by(-passo, 0)
    if keyp("RIGHT"):

    if keyp("UP"):
        heroi.move_by(0, passo)
    if keyp("DOWN"):
        heroi.move_by(0, -passo)


run()

        <p>No canto de cima, um vigia dourado olha para o herói. A linha que sai dele fica vermelha quando ele vê o herói, e cinza quando uma caixa está no caminho. O herói pode se esconder atrás das caixas.</p>

            <p>Há dois jeitos de saber de uma colisão.</p>
            <p>Uma <strong>regra</strong> fica valendo e chama a sua função quando o toque acontece: <code>@collide</code> (começou), <code>@collide_stay</code> (continua), <code>@collide_exit</code> (acabou), ou o <code>resolve</code>, que segura. Você escreve uma vez, no topo do arquivo ou na classe.</p>
            <p>Uma <strong>pergunta</strong> é feita na hora, quando o seu código quer saber: num clique, num <code>update</code>, num evento.</p>
            <div class="tbl"><table>
              <thead><tr><th>Pergunta</th><th>Responde</th></tr></thead>
              <tbody>
                <tr><td><code>collision.query_point(x, y)</code></td><td>Quem está neste ponto (uma lista).</td></tr>
                <tr><td><code>collision.query_circle(x, y, radius=)</code></td><td>Quem está nesta área redonda.</td></tr>
                <tr><td><code>collision.query_sector(…)</code></td><td>Quem está num cone, como o campo de visão de um guarda.</td></tr>
                <tr><td><code>collision.raycast(a, p2=b)</code></td><td>A primeira coisa que a linha de <code>a</code> até <code>b</code> atinge, e onde.</td></tr>
                <tr><td><code>forma.contains_point(p)</code></td><td>Se o ponto cai no desenho desta forma.</td></tr>
              </tbody>
            </table></div>
