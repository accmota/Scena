        <p>Este apêndice junta comandos gerais do Scena que todo jogo pode usar, mas que nenhum dos jogos dos tutoriais precisou explicar: o tamanho e o modo da janela, o fundo, as cores, os sorteios, o relógio, os valores que você quer espiar enquanto o jogo roda. Cada seção é um programa curto, que você pode rodar e modificar.</p>
        <p><strong>A régua.</strong> <code>init(width=800, height=600, title="Minha janela")</code> já apareceu em todo tutorial. <code>width</code> (largura) e <code>height</code> (altura) não são pixels do monitor: são a régua do seu jogo, as <em>medidas de design</em>. Com 800 × 600, x vai de 0 (borda esquerda) a 800 (borda direita), e y de 0 (embaixo) a 600 (em cima). O meio da tela é (400, 300). <code>title</code> (título) é o texto na barra da janela.</p>
        <p>Rode: os três círculos marcam o canto de baixo, à esquerda (0, 0), o meio (400, 300) e o canto de cima, à direita (800, 600). Nos cantos, só um quarto de cada círculo aparece: o centro está bem na borda, e o resto fica fora da tela.</p>
        <p><strong>Qualquer monitor.</strong> O Scena faz a janela do tamanho que cabe no seu monitor, com a mesma proporção da régua (aqui, 4 por 3). Num monitor grande ou pequeno, o desenho sai igual, só maior ou menor. Arrastar a borda da janela muda o tamanho, mas não a proporção.</p>
