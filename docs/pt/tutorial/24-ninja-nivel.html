        <p>O mundo do ninja, no 18, cabia numa tela, e cada peça do chão era uma linha de código: um <code>for</code> para o chão, uma função para as plataformas, cinco pontos escritos à mão para as estrelas. Para um nível de verdade, quatro vezes mais largo que a tela, isso vira centenas de números.</p>
        <p>Neste tutorial, duas ideias. O nível é desenhado num <strong>editor de fases</strong>, e o código só decide o que cada peça faz. E um nível maior que a tela precisa de uma <strong>câmera que segue</strong> o ninja.</p>
        <p>O ponto de partida é o jogo do 18, como ficou.</p>

class Kunai(Sprite, source="ninja/Kunai.png", height=44, art_angle=90, group="kunai"):

        self.move_by(seta.x * dt, 0)


class Robo(Sprite, source=robo, group="robo", hitbox_shape="rect"):
    def setup(self):
        self.meio = self.center.x
        self.vel = Vec2(90, 0)
        self.play("andando")

    def on_update(self, dt):
        if self.center.x > self.meio + 90:

            self.flip_x = True
        if self.center.x < self.meio - 90:

            self.flip_x = False

        kunai.destroy()
        self.untag("robo")
        self.vel.x = 0
        self.play("quebrado", loops=1)
        play_sound("audio/explosion02.wav")
        self.after(2, self.destroy)


class Heroi(Sprite, source=ninja, group="heroi", hitbox_shape="rect"):
    def setup(self):
        self.vel = Vec2(0, 0)

    def on_update(self, dt):
        if st.vidas == 0:
            self.vel.y -= 2200 * dt
            self.move_by(0, self.vel.y * dt)
            if "bottom" in self.touching_sides and not self.showing("morto"):
                self.play("morto", loops=1)
            return

        if keyp("LEFT"):
            self.vel.x = -280
            self.flip_x = True
        elif keyp("RIGHT"):
            self.vel.x = 280
            self.flip_x = False
        else:
            self.vel.x = 0

        no_chao = "bottom" in self.touching_sides
        pode_pular = recently("no_chao", no_chao, hold=0.12)
        if keyp.once("UP") and pode_pular:
            self.vel.y = 900
            recently.reset("no_chao")
            play_sound("synth/jump.wav")

        if keyp("SPACE") and ready("kunai", 0.4):
            self.play("jogando", loops=1, next="parado")
            kunai = Kunai(center=(self.center.x, self.center.y + 50))
            kunai.rotate_to(self.angle)
            play_sound("synth/throw.wav")

        self.vel.y -= 2200 * dt
        self.move_by(self.vel.x * dt, self.vel.y * dt)
        if self.center.y < 30:
            self.perder()

        if self.showing("jogando"):
            return
        if not no_chao:
            self.play("pulando")
        elif self.vel.x != 0:
            self.play("correndo")
        else:
            self.play("parado")

    @collide_with("estrela")
    def pegou(self, estrela):
        estrela.destroy()
        st.estrelas += 1
        play_sound("synth/coin.wav")
        if st.estrelas == 5:
            aviso.text = "Todas as estrelas!"
            play_sound("audio/Victory.mp3")

    @collide_with("robo")
    def bateu(self, robo):
        self.perder()

    def perder(self):
        if st.vidas == 0:
            return
        st.vidas -= 1
        canvas.shake(6)
        if st.vidas > 0:
            play_sound("audio/sfx-hit-2.wav")
            self.center = (100, 400)
            self.vel = Vec2(0, 0)
            self.blink(1)
        else:
            play_sound("audio/gameover.wav")
            aviso.text = "Fim de jogo"


resolve("heroi", "chao", bounce=0)

heroi = Heroi(center=(100, 400))

Sprite("tilesets/Tiles/17.png", width=80, center=(600, 31))


@leave_playfield("kunai")
def saiu(kunai):
    kunai.destroy()


run()

        <p><strong>Desenhar, não escrever.</strong> O Scena vem com um editor de fases, um programa à parte onde você põe as peças com o mouse: imagens, retângulos, pontos. Cada coisa pode ter um nome e grupos. O editor salva tudo num arquivo <code>.json</code>, e o jogo lê esse arquivo. A caixa abaixo conta como abrir o editor e desenhar; a fase deste tutorial já vem pronta, na pasta <code>media</code>: <code>levels/ninja.json</code>, com 4000 de largura e a altura da tela.</p>
        <p><strong>Ler a fase.</strong> <code>Level("levels/ninja.json")</code> (nível, fase) lê o arquivo e não cria nada na tela. O código decide. <code>fase.group("chao")</code> é a lista das peças que estão no grupo <code>chao</code> no editor (as peças do chão e das plataformas), e <code>make()</code> (fazer) cria cada uma como foi desenhada: o <code>Sprite</code> com aquela imagem, naquele lugar, naquele tamanho, já no grupo <code>chao</code>. O mesmo para os enfeites (antes, para ficarem atrás) e para a água (depois do ninja, para ficar na frente). O <code>resolve</code> e o <code>STATIC</code> continuam como estavam: eles falam do grupo, e o grupo agora vem da fase.</p>
        <p><strong>As paredes.</strong> No editor, as duas paredes são retângulos, um logo antes do começo da fase e outro logo depois do fim, no grupo <code>parede</code>. O código decide o resto: <code>make(group="chao")</code> soma o grupo <code>chao</code> (o ninja para nelas), e <code>visible = False</code> as esconde. É a ideia do tutorial numa linha: o editor põe, o código decide o que é.</p>

            <p><strong>Abrir.</strong> O editor vem junto com o Scena. No terminal, na pasta do seu jogo: <code>python -m scena_editor media/levels/ninja.json</code> abre esta fase; com outro nome, ele cria uma fase nova. (<code>python -m scena_editor --shortcut</code>, uma vez, cria um ícone para abrir com dois cliques.)</p>
