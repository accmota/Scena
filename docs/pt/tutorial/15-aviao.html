      body: `
        <p>Outro jogo: um avião voa entre pilares. Ele não anda para a frente; quem anda é o mundo, e o avião só sobe e desce. Cada par de pilares que ele atravessa vale um ponto, e uma batida acaba o voo.</p>
        <p><strong>O tamanho.</strong> As imagens do cenário deste jogo (e do próximo) são <em>pixel art</em> de 640 por 360 pixels. Com <code>init(width=640, height=360)</code>, o espaço do jogo tem o mesmo tamanho do desenho, e as contas ficam simples: a imagem cobre a tela inteira. A janela continua grande; o Scena amplia tudo junto.</p>
        <p><strong>O céu.</strong> <code>Wallpaper</code> (papel de parede) com um arquivo de imagem: o céu e as montanhas lá no fundo, parados. O avião, por enquanto, é um sprite parado também.</p>

    def bateu(self, pilar):
