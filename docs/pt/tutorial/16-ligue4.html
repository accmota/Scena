      body: `
        <p>Novo script, e um jogo de tabuleiro: o <strong>Ligue 4</strong>. Dois jogadores, o vermelho e o azul, jogam uma bola por vez numa grade de 7 colunas e 6 linhas; a bola cai pela coluna até a casa livre mais baixa. Quem fizer quatro bolas em linha primeiro ganha.</p>
        <p>Neste tutorial: um tabuleiro feito de casas, uma bola que você arrasta e solta numa coluna, e as regras do jogo escritas em Python simples, com listas. As peças vêm da folha que os pilares do Avião (11) já usavam: ela também tem buracos e bolas.</p>
        <p><strong>Uma caixa que não aparece.</strong> <code>Box</code> (caixa) é um retângulo que não se desenha: serve para medir e posicionar. Ele se escreve como um <code>Rect</code>, com <code>center=</code>, <code>width=</code> e <code>height=</code>. A <code>zona</code> é o lugar das casas: 560 por 480.</p>
        <p><strong>A moldura.</strong> O tabuleiro é um <code>Rect</code> feito da zona. <code>box=zona.outset(14)</code> é a zona alargada 14 para fora (<code>outset</code>) de cada lado, e <code>corner_radius=24</code> (raio do canto) arredonda os cantos. Os números ficam num lugar só: mude a zona, e a moldura vai junto.</p>
        <p><strong>A grade.</strong> <code>zona.grid(7, 6)</code> fatia a zona em 7 colunas e 6 linhas iguais e devolve a grade (<code>grid</code>). Cada casa é também um <code>Box</code>, de 80 por 80. O <code>for</code> passa pelas 42 casas e põe um buraco em cada uma (o quadro <code>hole_large.png</code>). <code>box=casa</code> encaixa o sprite na casa: no centro dela, do tamanho dela.</p>
