      title: "O quadro",
      body: [
        `
        <p>Ao longo da série, o seu código rodou de muitos jeitos: no <code>update</code>, num <code>@collide</code>, num <code>@every</code>, depois de um <code>after</code>, numa fórmula, num modo <code>async</code>. Cada tutorial apresentou a peça de que o jogo precisava. Este interlúdio junta as peças numa ideia só, com um cruzamento: uma rua, um semáforo, carros e pedestres.</p>
        <p>Tudo começa no <strong>quadro</strong>. Um jogo do Scena é uma fila de quadros, uns 60 por segundo, e em cada um o Scena faz as mesmas coisas, sempre na mesma ordem:</p>

        </figure>
        <p>Nada roda ao mesmo tempo que outra coisa. Cada função que o Scena chama roda até o fim, e só então vem a próxima. Para começar, um carro e duas maneiras de ler o teclado.</p>

from scena import *

init(width=1000, height=700, title="Semáforo")
Wallpaper("#6a9a52")

Rect(center=(500, 350), width=240, height=700, color="#44444c")

frota = Sheet("racing/spritesheet_vehicles.png", atlas="racing/spritesheet_vehicles.xml")
CARROS = ["car_red_1.png", "car_blue_3.png", "car_green_2.png", "car_yellow_5.png", "car_black_4.png"]


class Carro(Sprite, source=frota, height=100, group="carros"):
    def on_update(self, dt):
        self.move_by(0, 220 * dt)

    @leave_playfield
    def saiu(self):
        self.destroy()


def novo_carro():
    Carro(frame=choice(CARROS), center=(500, -60))


transito = every(1.6, novo_carro)


def on_key_down(key):
    if key == "P":
        if transito.paused:
            transito.resume()
        else:
            transito.pause()


run()

            <p>Todo processo do Scena devolve um Handle: <code>after</code>, <code>every</code>, um <code>move_to</code> com <code>time=</code>, um <code>play_sound</code>, uma tarefa. É sempre o mesmo controle, com as mesmas leituras:</p>
            <div class="tbl"><table>
              <thead><tr><th>No Handle</th><th>O que faz</th></tr></thead>
              <tbody>
                <tr><td><code>h.done</code></td><td>já terminou? (<code>True</code> ou <code>False</code>)</td></tr>
                <tr><td><code>h.cancel()</code></td><td>cancela: o timer não dispara mais, o movimento para onde está</td></tr>
                <tr><td><code>h.pause()</code> · <code>h.resume()</code></td><td>segura e retoma, sem perder a vez</td></tr>
                <tr><td><code>h.elapsed</code> · <code>h.remaining</code></td><td>quanto tempo já passou, quanto falta</td></tr>

            </table></div>

            <p>No Guia: <a href="../guide/index.html#agendar-timers">after / every</a> · <a href="../guide/index.html#agendar-handle">Handle</a>.</p>

    def on_click(self):
        self.mode = self.voltando

    @on_mode
    async def voltando(self):
        lado = 350 if self.center.x < 500 else 650
        await self.move_to(lado, self.center.y, time=0.6, face=True)
        await self.move_by(0, 450, time=4, face=True)
        self.destroy()


def novo_pedestre():
    Pedestre(frame=choice(GENTE), center=(350, uniform(320, 380)))


every(5, novo_pedestre)


async def ciclo():
    while True:
        st.luz = "verde"
        await wait(4)
        st.luz = "amarelo"
        await wait(1)
        st.luz = "vermelho"
        await wait(4)


async def alerta():
    while True:
        st.luz = "alerta"
        await wait(0.5)
        st.luz = "apagado"
        await wait(0.5)


def on_key_down(key):
    if key == "P":
        if transito.paused:
            transito.resume()
        else:
            transito.pause()
    if key == "N":
        run_task(alerta, name="semaforo")
    if key == "D":
        run_task(ciclo, name="semaforo")


run_task(ciclo, name="semaforo")


run()
