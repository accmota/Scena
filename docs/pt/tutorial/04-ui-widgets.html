      body: `
        <p>Este tutorial é sobre <strong>widgets</strong> (controles): sliders, caixas, listas, botões e menus, o painel com que você mexe num programa enquanto ele roda. Para ter o que controlar, começamos por uma animação simples, num script novo: uma cadeia de bolas que segue o mouse, como uma cobra.</p>
        <p><strong>As bolas.</strong> A função <code>criar</code> faz trinta círculos no centro da vista (<code>canvas.game_view.center</code>), todos no grupo <code>bolas</code>. A cor começa em tomate, e <code>cor.darker(0.02)</code> (mais escura) a escurece um pouco a cada volta do <code>for</code>: a cauda sai mais escura que a cabeça. Por que uma função, se a chamamos uma vez só? Porque, daqui a dois passos, um botão vai chamá-la de novo para refazer a cadeia.</p>
        <p><strong>O movimento.</strong> <code>chase</code> (perseguir) aproxima um número de outro, um pedaço a cada quadro: <code>chase(atual, alvo, rate=8)</code>. Quando está longe, anda muito; perto, pouco. Por isso a bola freia suave ao chegar. <code>rate</code> (taxa) é a pressa: quanto maior, mais rápido alcança. No <code>update</code>, só a primeira bola persegue o mouse; cada uma das outras persegue a da frente (<code>bolas[i - 1]</code>). Cada uma chega um pouco atrasada, e é esse atraso em fila que faz a cadeia ondular.</p>
        <p><code>Plasma</code> é o fundo: uma névoa colorida que se move devagar (<code>speed</code>, velocidade). Rode e mexa o mouse.</p>

      code: `from scena import *

init(width=1000, height=700, title="Mouse e teclado")

Plasma(speed=0.2)

# --- cadeia: a ponta segue o mouse; cada bola segue a anterior -------------
def criar():
    cor = Color("tomato")
    centro = canvas.game_view.center
    for i in range(30):
        bola = Circle(center=centro, radius=16, color=cor, group="bolas")
        bola.visual = Halo(style="pulse")
        cor = cor.darker(0.02)


criar()


def update(dt):
    bolas = group["bolas"]

    # a primeira segue o mouse
    ponta = bolas[0]
    x = chase(ponta.center.x, mouse.x, rate=8)
    y = chase(ponta.center.y, mouse.y, rate=8)
    ponta.move_to(x, y)

    # as outras seguem a da frente
    for i in range(1, bolas.count):
        bola = bolas[i]
        da_frente = bolas[i - 1]
        x = chase(bola.center.x, da_frente.center.x, rate=8)
        y = chase(bola.center.y, da_frente.center.y, rate=8)
        bola.move_to(x, y)


run()

        <p>Esse ângulo é medido em <strong>radianos</strong>, não em graus: uma volta inteira vale 6.28 (duas vezes π). Guarde esse número, ele volta no rastro.</p>
        <p><strong>O tempo.</strong> O ângulo da ponta é <code>st.tempo</code>. A cada quadro, <code>update</code> soma <code>dt * st.n</code> nele. Como <code>dt</code> é a duração do quadro, o ângulo cresce <code>st.n</code> radianos por segundo: com <code>n</code> em 4, uma volta leva pouco mais de um segundo e meio. Por que somar aos poucos, e não escrever <code>clock.time * st.n</code>, como nas barras? Porque <code>n</code> é um slider. Na multiplicação, mudar <code>n</code> muda o ângulo inteiro de uma vez, e a ponta pula. Somando, mudar <code>n</code> só muda a velocidade daqui para frente.</p>
        <p><strong>Dois giros somados.</strong> A fórmula da <code>ponta</code> tem duas partes. A primeira, <code>200 * cos(st.tempo)</code>, é o círculo grande em volta da bola. A segunda, <code>st.x1 * cos(st.tempo * st.tx1)</code>, é o círculo pequeno: raio <code>x1</code>, com o ângulo <code>tx1</code> vezes mais rápido. Ele dá <code>tx1</code> voltas a cada volta grande. O y repete a ideia com <code>sin</code>, <code>y1</code> e <code>ty1</code>.</p>

        <p><code>Point()</code> (ponto) cria um ponto invisível, e <code>ponta @= lambda: (…)</code> liga a ele uma fórmula que devolve <code>(x, y)</code>. Como lê <code>bola</code> e <code>st</code>, a ponta acompanha os dois: arraste um slider e ela muda de caminho no mesmo quadro.</p>
