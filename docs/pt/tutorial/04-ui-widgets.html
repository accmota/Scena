        <p><strong>A bola.</strong> Começamos por uma bola só, a ponta da futura cadeia. Ela nasce no centro da vista: <code>canvas.game_view.center</code> (o centro da vista do jogo). <code>Halo(style="pulse")</code> é um visual de auréola que pulsa.</p>

        <p><code>Plasma</code> é o fundo: uma névoa colorida que se move devagar (<code>speed</code>, velocidade). Rode e mexa o mouse: a bola vai atrás do ponteiro e freia ao chegar.</p>
