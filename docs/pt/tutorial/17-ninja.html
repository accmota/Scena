        <p>Outro jogo: um ninja que anda, pula e cai. É um jogo de plataforma, e este tutorial é sobre o que todo jogo de plataforma precisa: <strong>gravidade</strong> e <strong>chão</strong>. Primeiro, o cenário.</p>
        <p><strong>O fundo.</strong> Como no 14, o espaço do jogo tem o tamanho da imagem do fundo: <code>init(width=1000, height=750)</code>, e o <code>Wallpaper</code> com o arquivo cobre a tela inteira.</p>
        <p><strong>O chão em peças.</strong> A arte do chão vem em <strong>peças</strong> (<em>tiles</em>, ladrilhos): quadrados de 128 pixels, desenhados para se encaixar lado a lado. O <code>for</code> põe 13 peças de 80 de altura, uma ao lado da outra: os centros vão de x = 40 a x = 1000, de 80 em 80. Todas entram no grupo <code>chao</code>.</p>
        <p><strong>Plataformas.</strong> Uma plataforma solta no ar tem três peças: a ponta esquerda (<code>13.png</code>), o meio (<code>14.png</code>) e a ponta direita (<code>15.png</code>). A função <code>plataforma(x, y)</code> monta as três em volta do ponto (x, y); duas chamadas, duas plataformas. Elas também vão para o grupo <code>chao</code>: para o ninja, tudo isso é chão.</p>
        <p>O ninja, por enquanto, é um sprite parado. O chão termina em y = 80, e o centro do ninja está 44 acima (metade da altura dele): de pé.</p>

ninja = Sheet(anchor="bottom", pixel_size=0.2)
ninja.strip("parado", "ninja/Idle__*.png", fps=8)
ninja.strip("correndo", "ninja/Run__*.png", fps=12)
ninja.strip("pulando", "ninja/Jump__*.png", fps=10)


class Heroi(Sprite, source=ninja, group="heroi", hitbox_shape="rect"):
    def setup(self):
        self.vel = Vec2(0, 0)

    def on_update(self, dt):
        if keyp("LEFT"):
            self.vel.x = -280
            self.flip_x = True
        elif keyp("RIGHT"):
            self.vel.x = 280
            self.flip_x = False
        else:
            self.vel.x = 0

        no_chao = "bottom" in self.touching_sides
        if keyp.once("UP") and no_chao:
            self.vel.y = 900
            play_sound("synth/jump.wav")

        self.vel.y -= 2200 * dt
        self.move_by(self.vel.x * dt, self.vel.y * dt)

        if not no_chao:
            self.play("pulando")
        elif self.vel.x != 0:
            self.play("correndo")
        else:
            self.play("parado")


resolve("heroi", "chao", bounce=0)

heroi = Heroi(center=(100, 400))


run()

      try: [
          {
            note: "No ar, o ninja plana em vez de pular: os arquivos Glide_000.png a Glide_009.png (planar; o nome tem um sublinhado só). No lugar da linha do pulando:",
            replaces: ['ninja.strip("pulando"'],

      closing: `
        <p>Setas para os lados andam; seta para cima pula, só com os pés no chão. O ninja corre, pula e cai com a gravidade, pisa no chão e nas plataformas e bate a cabeça embaixo delas.</p>
      `,
      recap: `
        <ul>
          <li><code>vel.y -= 2200 * dt</code> — a gravidade à mão: a velocidade para baixo cresce a cada quadro. Um pulo é uma velocidade para cima que ela gasta.</li>
          <li><code>resolve</code> com <code>bounce=0</code> e <code>STATIC</code> — o chão segura o ninja e zera a velocidade que entra nele.</li>
          <li><code>hitbox_shape="rect"</code> — a caixa de colisão de base reta, para quem anda sobre um chão.</li>
          <li><code>touching_sides</code> — quais lados encostam em algo sólido; <code>"bottom"</code> é estar no chão.</li>
          <li><code>flip_x</code> — espelha o desenho: o ninja olha para o lado em que anda.</li>
          <li><code>strip</code> com <code>*</code>, <code>pixel_size</code> e <code>anchor="bottom"</code> — uma animação por linha, de arquivos de tamanhos diferentes, cada um no seu tamanho e com os pés no chão.</li>
        </ul>
