      body: `
        <p>Num jogo de naves, um inimigo não faz sempre a mesma coisa. Ele fica um tempo na formação, de repente mergulha, e depois volta ao seu lugar. Cada uma dessas partes é um <strong>modo</strong> (<code>mode</code>): um capítulo da vida do inimigo.</p>
        <p><strong>Um modo é uma função.</strong> Na classe <code>Inimigo</code>, <code>formacao</code> e <code>mergulho</code> são os dois capítulos. No <code>setup</code>, <code>self.mode = self.formacao</code> põe o inimigo no capítulo da formação. Entrar num modo roda a função uma vez, como o <code>setup</code> roda uma vez quando o objeto nasce. Repare: <code>self.formacao</code>, sem parênteses. O modo é a própria função, não uma chamada dela. O <code>@on_mode</code> (no modo) em cima de cada uma só marca: diz a quem lê que aquela função é um capítulo.</p>
        <p><strong>Daqui a pouco, mergulhe.</strong> O corpo de <code>formacao</code> tem uma linha: <code>after(uniform(3, 12), then=self.mergulho)</code>. É o <code>after</code> do 02, com <code>then=</code> (então) no lugar da função: quando o tempo acaba, o inimigo entra no modo <code>mergulho</code>. <code>uniform(3, 12)</code> (uniforme), do <code>random</code> como o <code>choice</code>, sorteia um número qualquer entre 3 e 12: cada inimigo espera o seu tempo.</p>
        <p><strong>O mergulho.</strong> <code>move_to</code> (mover até) com <code>time=0.9</code> (tempo) leva o inimigo até a altura 220 em 0,9 segundo, aos poucos, como o <code>scale_to</code> do 05 fazia crescer aos poucos. <code>loops=2, yoyo=True</code> são duas voltas em ioiô: a ida e a volta, pelo mesmo caminho. <code>ease="ease_in_out"</code> (suavizar) começa devagar, acelera e freia no fim. E <code>then=self.formacao</code>: quando as duas voltas acabam, o inimigo volta à formação, e a função <code>formacao</code> roda de novo, com outro tempo sorteado.</p>

        <figure class="fig">
          <svg viewBox="0 0 400 170" role="img" aria-label="Dois capítulos, formacao e mergulho. O setup leva à formacao; uma seta de cima vai da formacao ao mergulho, com after e then; uma seta de baixo volta do mergulho à formacao, com move_to e then">

            <text x="12" y="74">setup</text>
            <rect class="bar" x="72" y="62" width="104" height="46" rx="10"/>
            <text x="94" y="89">formacao</text>
            <rect class="bar child" x="250" y="62" width="104" height="46" rx="10"/>
            <text x="274" y="89">mergulho</text>
            <path class="guide" d="M 150 60 Q 213 14 276 60"/>
            <line class="ray" x1="276" y1="60" x2="266" y2="57"/>
            <line class="ray" x1="276" y1="60" x2="272" y2="50"/>
            <text x="163" y="24">after(…, then=)</text>
            <path class="guide" d="M 276 110 Q 213 156 150 110"/>
            <line class="ray" x1="150" y1="110" x2="160" y2="113"/>
            <line class="ray" x1="150" y1="110" x2="154" y2="120"/>
            <text x="157" y="160">move_to(…, then=)</text>
          </svg>
          <figcaption>Dois capítulos. A formação espera um tempo e passa ao mergulho; o mergulho, quando a viagem acaba, volta à formação.</figcaption>
        </figure>

        <p><strong>De volta à vaga.</strong> A frota continua balançando durante o mergulho. Um movimento com <code>time=</code> anda um pedaço a cada frame, e o <code>move_by</code> da frota, no <code>update</code>, continua somando o dele. Por isso o inimigo volta exatamente para a sua vaga, mesmo com a frota em outro lugar.</p>
        <p>Espere uns segundos: os inimigos descem, um aqui, outro ali, e voltam. Por enquanto, em linha reta.</p>

            <p><code>then=</code> aparece no <code>after</code>, nos verbos com <code>time=</code> e no <code>play_sound</code>, e recebe sempre um modo. Para chamar uma função qualquer no fim, sem trocar de capítulo, o nome é <code>on_done=</code> (ao terminar).</p>
            <p>No Guia: <a href="../guide/index.html#mode-enter">mode</a> · <a href="../guide/index.html#agendar-fim">Ao terminar</a> · <a href="../guide/index.html#mover-pose">move_to</a>.</p>

        for dx in [-40, 0, 40]:
            TiroInimigo(center=(self.center.x + dx, self.center.y - 50))
        play_sound("audio/laser7.wav")

    @collide_with("tiros")
    def atingido(self, tiro, info):
        tiro.destroy()
        if self.mode != self.lutando:
            return
        canvas.hit_at(info)
        self.flash(0.08)
        self.vida -= 1
        if self.vida == 0:
            self.mode = self.morrendo

    @on_mode
    async def morrendo(self):
        for vez in range(5):
            canvas.explosion_at(self.center + (uniform(-50, 50), uniform(-30, 30)), amount=0.6)
            play_sound("audio/explosion02.wav")
            await wait(0.3)
        canvas.shake(14)
        Explosao(center=self.center)
        st.pontos += 20
        Text(text="VITÓRIA", center=(500, 400), font_size=48)
        self.destroy()

    def on_destroy(self):
        self.barra.destroy()


class Poder(Sprite, source=folha, frame="powerupBlue_shield.png", height=30, group="poderes"):
    def on_update(self, dt):
        self.move_by(0, -150 * dt)


class Escudo(Circle, radius=38, visual=Shield(style="plasma")):
    @collide_with("tiros_inimigos")
    def bloqueou(self, tiro, info):
        canvas.zap_at(info, color="sky blue")
        play_sound("audio/sfx-hit-2.wav", pitch=1.6)
        tiro.destroy()
        st.energia -= 20


class Heroi(Sprite, source=folha, frame="playerShip1_red.png", height=45, group="heroi"):
    def setup(self):
        self.glow = True
        self.propulsor = Jet(origin=lambda: (self.center.x, self.center.y - 22),
                             angle=270, length=40, width=16, amount=2)
        self.escudo = Escudo(center=lambda: self.center)
        self.escudo.active = False

    def on_update(self, dt):
        if keyp("LEFT"):
            self.move_by(-340 * dt, 0)
        if keyp("RIGHT"):
            self.move_by(340 * dt, 0)
        self.confine(canvas.game_view.inset(40))

        if keyp("SPACE") and ready("tiro", 0.2):
            Tiro(center=(self.center.x, self.center.y + 28))
            play_sound("audio/laser4.wav")

    @collide_with("tiros_inimigos")
    def atingido(self, tiro):
        tiro.destroy()
        if not ready("dano", 1.5):
            return
        st.vidas -= 1
        canvas.shake(8)
        if st.vidas > 0:
            self.blink(1.5)
            play_sound("audio/sfx-hit-2.wav")
        else:
            canvas.flash(0.4)
            canvas.explosion_at(self, amount=1.2)
            Fire(center=self.center, radius=30)
            Text(text="FIM DE JOGO", center=(500, 400), font_size=48)
            play_sound("audio/gameover.wav")
            self.destroy()

    @collide_with("poderes")
    def pegou(self, poder):
        poder.destroy()
        self.pop()
        play_sound("audio/fx1.wav")
        st.energia = 100

    @on_change(lambda self: st.energia)
    def energia_mudou(self):
        self.escudo.active = st.energia > 0
        if st.energia == 0:
            canvas.burst_at(self, radius=70, rings=True)
            play_sound("audio/impactBell_heavy_000.ogg")

    def on_destroy(self):
        self.propulsor.destroy()
        self.escudo.destroy()


nave = Heroi(center=(500, 70))

for linha in range(3):

@when(lambda: group["inimigos"].count == 0)
def chega_o_chefe():

        if inimigo.center.x < 40:

@leave_playfield("tiros", "tiros_inimigos", "poderes")
def saiu(tiro):
