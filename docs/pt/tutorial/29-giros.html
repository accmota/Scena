        <p>O último tutorial é sobre <strong>giros que se somam</strong>. São dois scripts, os dois de arte, não de jogo, feitos com o que a série juntou: funções, fórmulas e um pouco de matemática. No primeiro, uma barra gira; em cada ponta dela nasce uma barra menor, que também gira; nas pontas dessas, outras, e assim por diante. Sessenta e três barras desenham laços que parecem complicados, e saem de uma regra curta. No segundo, um ponto dá uma volta grande e uma pequena ao mesmo tempo, e um rastro mostra a figura que os dois giros fazem juntos.</p>
        <p>Começamos com uma barra só.</p>
        <p><strong>A barra.</strong> <code>Rect</code> (retângulo) no centro da janela, com <code>width</code> (largura) 500 e <code>height</code> (altura) 33: comprida e fina.</p>

        <p><strong>O giro.</strong> A linha <code>barra["angle"] @= …</code> liga o ângulo a uma fórmula. Com <code>@=</code>, o Scena refaz a conta a cada quadro, como no placar do tutorial 2; o nome do campo vai entre colchetes, para apontar o campo que recebe a fórmula. A fórmula lê <code>clock.time</code> (relógio, tempo): quantos segundos se passaram desde o início. Vezes 26, a barra gira 26 graus por segundo, e uma volta leva uns 14 segundos. O campo gira a barra em volta do ponto pelo qual ela foi posta, aqui o centro; o interlúdio <a href="14i-girar-e-crescer.html">Girar e crescer</a> mostra o que muda quando é outro ponto.</p>

        <p>Vamos precisar de muitas barras, todas feitas do mesmo jeito: muda só o tamanho, o lugar e o giro. Em vez de copiar as linhas da barra várias vezes, escrevemos uma <strong>função</strong>, uma receita que se usa quantas vezes quiser.</p>
        <p><strong>Parâmetros.</strong> Você já escreveu funções com <code>def</code>. Esta recebe informações: <code>nivel</code> e <code>centro</code>, entre os parênteses, são os <strong>parâmetros</strong>. Na chamada <code>criar_barra(1, (180, 150))</code>, o <code>nivel</code> vale 1 e o <code>centro</code> vale <code>(180, 150)</code>. A função roda as mesmas linhas com esses valores. As três chamadas no fim criam três barras, cada uma com o seu nível e o seu lugar. A linha da barra antiga sai: agora quem cria barras é a função.</p>
        <p><strong>O tamanho do nível.</strong> A barra do nível 0 é a grande, com <code>COMPRIMENTO</code> (metade da largura da janela). Cada nível seguinte tem a metade do anterior. Quem faz a conta é <code>FATOR_TAMANHO ** nivel</code>: <code>**</code> é a <strong>potência</strong> do Python, um número multiplicado por ele mesmo tantas vezes. <code>2 ** 0</code> é 1, <code>2 ** 1</code> é 2, <code>2 ** 2</code> é 4. Dividindo 500 por esses números, os comprimentos são 500, 250 e 125. A altura é sempre 1/15 do comprimento (<code>PROPORCAO</code>): as barras têm o mesmo formato, só o tamanho muda.</p>
        <p><strong>O giro do nível.</strong> A fórmula do ângulo ganha <code>FATOR_GIRO ** nivel</code>, com <code>FATOR_GIRO = -1.5</code>. No nível 0, isso dá 1; no nível 1, −1,5; no nível 2, 2,25 (negativo vezes negativo dá positivo). O sinal alterna: cada nível gira ao contrário do anterior, e um pouco mais rápido. Rode: a barra grande gira como antes, a média gira para o outro lado, e a pequena volta ao sentido da grande, mais depressa.</p>
