    {
      title: "Uma imagem",

      body: `
        <p>Este apêndice mostra os jeitos mais comuns de pôr imagens no Scena: uma imagem parada, uma animação feita de vários arquivos, uma faixa, uma folha com várias animações, um atlas e um desenho SVG. No fim, a forma com que uma imagem colide, a <strong>hitbox</strong>. Cada seção é um programa curto; rode, mude e rode de novo.</p>

      `,
      code: `from scena import *

Wallpaper("dark navy")

Sprite("space/playerShip1_red.png", center=(500, 250))

run()
`,
      notes: [
        {
          at: "Sprite(\"space/playerShip1_red.png\"",

        <p>Da esquerda para a direita:</p>

      body: `
        <p>Uma animação é uma sequência de imagens trocadas depressa, como num desenho animado. Cada imagem é um <strong>quadro</strong>. Muitos pacotes entregam um arquivo por quadro: <code>Run (1).png</code>, <code>Run (2).png</code>… até <code>Run (8).png</code>.</p>

      code: `from scena import *

init(width=1000, height=500, title="Arquivos")

robo = Sheet("robot/Run (*).png", fps=12)

run()

        {
          at: "robo = Sheet(",

        <figure class="fig">

            <line class="guide" x1="55" y1="20" x2="55" y2="60"/><line class="guide" x1="100" y1="20" x2="100" y2="60"/><line class="guide" x1="145" y1="20" x2="145" y2="60"/><line class="guide" x1="190" y1="20" x2="190" y2="60"/>
            <line class="guide" x1="235" y1="20" x2="235" y2="60"/><line class="guide" x1="280" y1="20" x2="280" y2="60"/><line class="guide" x1="325" y1="20" x2="325" y2="60"/>
            <text x="32" y="45" text-anchor="middle">0</text><text x="77" y="45" text-anchor="middle">1</text><text x="122" y="45" text-anchor="middle">2</text><text x="347" y="45" text-anchor="middle">…</text>

      `,
      code: `from scena import *

init(width=1000, height=500, title="Faixas")
Wallpaper("dark navy")

cereja = Sheet("pixel_adv/Cherries.png", cols=17, fps=20)
Sprite(cereja, height=160, center=(280, 250))

bandeira = Sheet("pixel_adv/Checkpoint (Flag Idle)(64x64).png", cell=(64, 64), fps=12)
Sprite(bandeira, height=220, center=(700, 260))

run()
`,
      notes: [
        {
          at: "cols=17",
          text: "A cereja tem 17 quadros (<code>cols</code>, colunas). Para saber o número, abra a imagem: ela tem 544 pixels de largura, e cada quadro, 32; 544 ÷ 32 = 17."
        },
        {
          at: "cell=(64, 64)",
          text: "Muitos pacotes escrevem o tamanho do quadro no nome do arquivo, como a bandeira: <code>(64x64)</code>. Com <code>cell</code> (célula), o Scena corta em pedaços desse tamanho e conta quantos cabem."
        }
      ],
      after: `
        <p>Uma imagem em grade, com várias linhas de quadros, leva também <code>rows=</code> (linhas).</p>
      `

    {
      title: "Várias animações",
      part: "Várias animações",
      fresh: true,
      body: `
        <p>Um personagem tem várias animações: parado, correndo, pulando. O pacote do ninja tem um arquivo por quadro, com um nome por animação: <code>Idle__000.png</code>, <code>Run__000.png</code>, <code>Jump__000.png</code>…</p>
        <figure class="fig">
          <svg viewBox="0 0 380 140" role="img" aria-label="Três grupos de arquivos, Idle, Run e Jump, entram numa folha só; cada grupo vira uma animação com nome: parado, correndo, pulando">
            <rect class="bar child" x="10" y="12" width="110" height="26"/><text x="65" y="30" text-anchor="middle">Idle__*.png</text>
            <rect class="bar child" x="135" y="12" width="110" height="26"/><text x="190" y="30" text-anchor="middle">Run__*.png</text>
            <rect class="bar child" x="260" y="12" width="110" height="26"/><text x="315" y="30" text-anchor="middle">Jump__*.png</text>
            <line class="ray" x1="65" y1="40" x2="65" y2="70"/><line class="ray" x1="190" y1="40" x2="190" y2="70"/><line class="ray" x1="315" y1="40" x2="315" y2="70"/>
            <rect class="bar" x="10" y="72" width="360" height="36"/>
            <text x="65" y="94" text-anchor="middle">"parado"</text><text x="190" y="94" text-anchor="middle">"correndo"</text><text x="315" y="94" text-anchor="middle">"pulando"</text>
            <text x="190" y="128" text-anchor="middle">uma folha, três animações; play("correndo") escolhe uma</text>
          </svg>
          <figcaption>Cada <code>strip</code> acrescenta à folha uma animação com nome. O <code>Sprite</code> toca uma de cada vez, com <code>play</code>.</figcaption>
        </figure>
      `,
      code: `from scena import *

init(width=1000, height=500, title="Animações")
Wallpaper("dark navy")

ninja = Sheet()
ninja.strip("parado", "ninja/Idle__*.png", fps=8)
ninja.strip("correndo", "ninja/Run__*.png", fps=12)
ninja.strip("pulando", "ninja/Jump__*.png", fps=10)

Sprite(ninja, height=200, center=(220, 250)).play("parado")
Sprite(ninja, height=200, center=(500, 250)).play("correndo")
Sprite(ninja, height=200, center=(780, 250)).play("pulando")

run()
`,
      notes: [
        {
          at: "ninja = Sheet()",
          text: "Uma folha que começa sem nada."
        },
        {
          at: "ninja.strip(\"correndo\"",
          text: "Cada <code>strip</code> (faixa) acrescenta uma animação com nome. O nome é seu, e é ele que o <code>play</code> usa."
        },
        {
          at: ".play(\"correndo\")",
          text: "<code>play</code> (tocar) escolhe a animação deste sprite."
        }
      ],
      after: `
        <p>Os três ninjas usam a mesma folha, cada um tocando uma animação. Num jogo, o mesmo sprite troca de animação conforme anda e pula: <code>play("pulando")</code> no pulo, <code>play("parado")</code> quando para.</p>
      `
    },
    {
      title: "Um atlas",
      part: "Um atlas",
      fresh: true,
      body: `
        <p>O último jeito: muitas imagens diferentes empacotadas numa imagem só, como peças de um quebra-cabeça, e um segundo arquivo (<code>.xml</code> ou <code>.json</code>) que diz onde está cada uma e como se chama. É um <strong>atlas</strong>, o formato dos pacotes do Kenney.</p>
        <figure class="fig">
          <svg viewBox="0 0 380 150" role="img" aria-label="Uma imagem grande com peças de tamanhos diferentes, cada uma com um nome; ao lado, o arquivo XML lista o nome e o retângulo de cada peça">
            <rect class="bar" x="10" y="10" width="200" height="130"/>
            <rect class="bar child" x="20" y="20" width="70" height="50"/><text x="55" y="49" text-anchor="middle">nave</text>
            <rect class="bar child" x="100" y="20" width="100" height="40"/><text x="150" y="44" text-anchor="middle">ufo</text>
            <rect class="bar child" x="20" y="80" width="50" height="50"/><text x="45" y="109" text-anchor="middle">tiro</text>
            <rect class="bar child" x="80" y="70" width="120" height="60"/><text x="140" y="104" text-anchor="middle">meteoro</text>
            <text x="225" y="34">sheet.xml:</text>
            <text x="225" y="56">nave   x=20  y=20 …</text>
            <text x="225" y="74">ufo    x=100 y=20 …</text>
            <text x="225" y="92">tiro   x=20  y=80 …</text>
            <text x="225" y="110">meteoro x=80 y=70 …</text>
          </svg>
          <figcaption>Num atlas, as peças têm tamanhos diferentes e um nome cada. O <code>.xml</code> diz onde está cada uma; <code>frame=</code> escolhe pelo nome.</figcaption>
        </figure>
      `,
      code: `from scena import *

init(width=1000, height=500, title="Atlas")
Wallpaper("dark navy")

naves = Sheet("shooter/sheet.png", atlas="shooter/sheet.xml")
Sprite(naves, frame="playerShip1_red.png", height=90, center=(200, 250))
Sprite(naves, frame="enemyGreen1.png", height=80, center=(420, 250))
Sprite(naves, frame="ufoBlue.png", height=80, center=(620, 250))
Sprite(naves, frame="meteorBrown_big1.png", height=100, center=(830, 250))

run()
`,
      notes: [
        {
          at: "atlas=\"shooter/sheet.xml\"",
          text: "<code>atlas=</code> dá o segundo arquivo, o que diz onde está cada peça."
        },
        {
          at: "frame=\"playerShip1_red.png\"",
          text: "<code>frame=</code> (quadro) escolhe uma peça pelo nome. Os nomes estão no <code>.xml</code>: abra-o num editor de texto."

      ],
      after: `
        <p>Uma folha só serve para o jogo inteiro: as naves, os inimigos, os meteoros.</p>
        <details class="ask"><summary>Qual dos jeitos usar?</summary><p>O que o pacote trouxer. Para o <code>Sprite</code>, tanto faz: ele funciona igual com qualquer folha. O Guia mostra os seis jeitos em <a href="../guide/index.html#sprite-carregar">Carregar sprites</a>.</p></details>
      `

    {
      title: "Desenhos SVG",
      part: "SVG",
      fresh: true,
      body: `
        <p>Além de PNG e JPG, o Scena abre <strong>SVG</strong> (<code>.svg</code>). Um PNG é feito de pixels, quadradinhos de cor; um SVG é feito de formas (linhas, curvas, cores) descritas num arquivo de texto. O programa põe os dois lado a lado, bem grandes.</p>
      `,
      code: `from scena import *

init(width=1000, height=500, title="SVG")
Wallpaper("dark navy")

Svg("svg/foguete.svg", height=100, center=(120, 250))
Svg("svg/foguete.svg", height=420, center=(400, 250))
Sprite("space/playerShip1_red.png", height=420, center=(780, 250))

run()
`,
      notes: [
        {
          at: "Svg(\"svg/foguete.svg\", height=420",
          text: "<code>Svg</code> funciona como o <code>Sprite</code>: centro, tamanho, ângulo, hitbox, grupos."

      ],
      after: `
        <p>Compare os dois grandes: o foguete SVG continua com as bordas limpas; a nave PNG, esticada muito além do tamanho do arquivo, fica borrada. O SVG é redesenhado no tamanho pedido; o PNG só pode esticar os pixels que tem.</p>
        <p>Desenhos em SVG se fazem em programas como o Inkscape (gratuito) ou se baixam prontos; ícones e formas simples ficam ótimos assim. Para arte com textura e sombreado, o PNG continua sendo o comum.</p>
      `
    },

      title: "A forma da colisão",
      part: "Hitboxes",
      fresh: true,
      body: `
        <p>Quando duas imagens se tocam, o Scena não compara os pixels: ele usa uma forma simples para cada uma, a <strong>hitbox</strong> (a caixa do golpe).</p>
        <figure class="fig">
          <svg viewBox="0 0 380 160" role="img" aria-label="Uma imagem com partes transparentes nos cantos. A caixa da imagem é maior que o desenho; a hitbox automática segue o desenho; a de círculo e a de retângulo são formas simples">
            <rect class="guide" x="20" y="20" width="100" height="100"/>
            <polygon class="bar" points="70,28 82,60 112,74 112,92 82,92 70,112 58,92 28,92 28,74 58,60"/>
            <text x="66" y="140" text-anchor="middle">a imagem e o desenho</text>
            <polygon class="bar" points="200,28 212,60 242,74 242,92 212,92 200,112 188,92 158,92 158,74 188,60"/>
            <ellipse class="guide" cx="200" cy="70" rx="12" ry="40"/>
            <ellipse class="guide" cx="200" cy="83" rx="42" ry="10"/>
            <text x="204" y="140" text-anchor="middle">auto: segue o desenho</text>
            <polygon class="bar" points="320,28 332,60 362,74 362,92 332,92 320,112 308,92 278,92 278,74 308,60"/>
            <rect class="guide" x="278" y="28" width="84" height="84"/>
            <text x="320" y="140" text-anchor="middle">rect: a caixa</text>
          </svg>
          <figcaption>A imagem é um retângulo, mas o desenho dentro dela não: os cantos são transparentes. A hitbox <code>"auto"</code> cobre o desenho com formas simples (aqui, duas elipses) e deixa os cantos vazios de fora. <code>"rect"</code> é a caixa do desenho inteira.</figcaption>
        </figure>
        <p>O programa mostra quatro naves iguais, cada uma com uma hitbox diferente.</p>
      `,
      code: `from scena import *

init(width=1000, height=500, title="Hitboxes")
Wallpaper("dark navy")
collision.show_colliders(True)

auto = Sprite("space/playerShip1_red.png", height=150, center=(140, 260))
circulo = Sprite("space/playerShip1_red.png", height=150, center=(380, 260), hitbox_shape="circle")
caixa = Sprite("space/playerShip1_red.png", height=150, center=(620, 260), hitbox_shape="rect")
menor = Sprite("space/playerShip1_red.png", height=150, center=(860, 260), hitbox_scale=0.6)
for nave in [auto, circulo, caixa, menor]:
    nave.collidable = True

run()
`,
      notes: [
        {
          at: "collision.show_colliders(True)",
          text: "Desenha as hitboxes em verde; é o mesmo que <kbd>Ctrl+Shift+7</kbd> (Apêndice A)."
        },
        {
          at: "nave.collidable = True",
          text: "<code>collidable</code> (colidível) liga a colisão de cada nave, só para mostrar a hitbox dela."
        }
      ],
      after: `
        <div class="tbl"><table>
          <thead><tr><th>Você dá</th><th>A hitbox</th></tr></thead>
          <tbody>
            <tr><td>nada (<code>"auto"</code>)</td><td>O Scena olha o desenho e escolhe, entre círculos, elipses e retângulos, a forma que melhor o cobre. Ele prefere errar para dentro: um toque que não aconteceu incomoda mais que um que passou raspando.</td></tr>
            <tr><td><code>hitbox_shape="circle"</code></td><td>Um círculo. Bom para coisas redondas e para o que gira.</td></tr>
            <tr><td><code>hitbox_shape="rect"</code></td><td>A caixa do desenho. Bom para personagens que andam e pisam no chão.</td></tr>
            <tr><td><code>hitbox_scale=0.6</code></td><td>A mesma forma, encolhida. Um herói com hitbox menor que o desenho perdoa os quase-toques.</td></tr>
          </tbody>
        </table></div>
        <p>Um ninja que anda numa plataforma usa <code>"rect"</code>, para pisar firme. Um escudo em forma de anel usa <code>"circle"</code>, porque a forma automática de um anel fica com um pedaço dele só.</p>
        <p>No Guia: <a href="../guide/index.html#spr-hit">Hitbox do Sprite</a>.</p>
      `
    }
  ]
});
