        <p>Além de PNG e JPG, o Scena abre <strong>SVG</strong> (<code>.svg</code>). Um PNG é feito de pixels, quadradinhos de cor; um SVG é feito de formas (linhas, curvas, cores) descritas num arquivo de texto.</p>
        <p><strong>Nítido em qualquer tamanho.</strong> Compare os dois grandes: o foguete SVG continua com as bordas limpas; a nave PNG, esticada muito além do tamanho do arquivo, fica borrada. O SVG é redesenhado no tamanho pedido; o PNG só pode esticar os pixels que tem.</p>
        <p><code>Svg("svg/foguete.svg")</code> funciona como o <code>Sprite</code>: centro, tamanho, ângulo, hitbox, grupos. Desenhos em SVG se fazem em programas como o Inkscape (gratuito) ou se baixam prontos; ícones e formas simples ficam ótimos assim. Para arte com textura e sombreado, o PNG continua sendo o comum.</p>
