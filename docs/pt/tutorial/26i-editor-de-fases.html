        <p><code>python -m scena_editor media/levels/meu_golfe.json</code></p>

            <p>Para mexer no que já está desenhado, <em>Select</em> (selecionar, <kbd>V</kbd>): clique numa peça e arraste-a, ou puxe as alças dela. <kbd>Esc</kbd> também volta para o <em>Select</em>, e <kbd>Espaço</kbd> + arrastar move a vista.</p>
