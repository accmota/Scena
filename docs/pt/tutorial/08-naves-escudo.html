        <p><strong>Estacionado.</strong> A nave começa sem escudo. <code>self.escudo.active = False</code> (ativo) <strong>estaciona</strong> o escudo: ele some e para, sem ser destruído. <code>active = True</code> o traz de volta, no mesmo lugar. É o jeito de ligar e desligar uma peça que vai e volta muitas vezes.</p>
