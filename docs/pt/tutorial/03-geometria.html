      body: `
        <p>Este tutorial é sobre geometria: formas que você pega com o mouse e formas que dependem umas das outras. São dois scripts. Neste primeiro, vamos arrastar círculos e um retângulo e ligá-los com linhas que os acompanham. No segundo, construímos o ponto médio de um segmento só com círculos, como se faz com compasso.</p>
        <p><strong>Duas escritas.</strong> Começamos com dois círculos escritos de jeitos diferentes. O primeiro você já conhece: <code>center</code> (centro) e <code>radius</code> (raio), aqui 60. O segundo troca o raio por <code>perimeter_point</code> (ponto do perímetro, isto é, da borda): um ponto por onde o contorno passa. O Scena mede a distância do centro até esse ponto e usa essa distância como raio. De (600, 350) até (620, 400), dá cerca de 54.</p>
        <p>Rode: dois círculos, nada de diferente à vista. A diferença está no que o Scena guarda. O primeiro círculo é um ponto e um número; o segundo é feito de dois pontos. Isso aparece no próximo passo, quando você puder pegá-los com o mouse. E o jeito dos dois pontos volta no segundo script: é ele que faz o papel do compasso.</p>

cruzamento1 = Point(lambda: intersection(circulo1, circulo2, 0))
cruzamento1.visible = True
cruzamento1.color = "white"

cruzamento2 = Point(lambda: intersection(circulo1, circulo2, 1))
cruzamento2.visible = True
cruzamento2.color = "white"

# Corda entre os cruzamentos (mediatriz)
corda = Line(p1=lambda: cruzamento1, p2=lambda: cruzamento2, color="gold")
corda.line_width = 2
corda.dash = "dash"  # ou "dot", "dot-dash", "solid"

# Ponto médio = interseção da corda com o segmento
meio = Circle(
    center=lambda: intersection(corda, segmento, 0),
    radius=8,
    color="gold",
)
meio.glow = True

run()
`,
      closing: `
        <p>Arraste as âncoras nas pontas do segmento. Os círculos, a corda e o ponto médio acompanham.</p>
      `
    }
  ]
});
</script>
