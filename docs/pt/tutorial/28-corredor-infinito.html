      body: `
        <p>Novo jogo: um corredor sem fim. O robô corre sozinho para a direita, cada vez mais rápido, e você só decide quando ele pula. O chão vai ter buracos, moedas e caixas, e nunca acaba.</p>
        <p>Este primeiro passo junta o que você já conhece. A folha do robô é montada como a do ninja do 18: uma animação por linha (<code>strip</code> com <code>*</code>), <code>pixel_size</code> e <code>anchor="bottom"</code>; os desenhos estão em <code>robot/</code>. A gravidade e o pulo também são os do 18: a cada segundo, <code>vel.y</code> perde 2200; a seta para cima dá 900 de uma vez, só com os pés no chão. O que muda: não há tecla para andar. O robô anda <code>st.velocidade</code> por segundo, sempre para a frente.</p>
        <p><strong>Um ato desde o começo.</strong> Como no 25, o jogo mora num ato: <code>class Corrida(Act)</code> monta a corrida no <code>setup</code>, e <code>run(Corrida)</code> a começa. Recomeçar, mais adiante, vai custar uma linha. <code>self.robo</code> guarda o robô para o <code>on_update</code> do ato.</p>
        <p><strong>A câmera vai atrás.</strong> Como no 26, um <code>pan_to</code> a cada quadro: o centro da tela fica 250 à frente do robô, e a altura fica fixa (270, o meio da tela). O robô fica parado na tela, e o mundo passa por ele.</p>
        <p>O buraco deste passo: o chão é um retângulo de 2400. Em uns sete segundos ele acaba, e o robô cai para fora do mundo.</p>

      code: `from scena import *

init(width=960, height=540, title="Corredor")

folha = Sheet(anchor="bottom", pixel_size=0.16)
folha.strip("correndo", "robot/Run (*).png", fps=14)
folha.strip("pulando", "robot/Jump (*).png", fps=14)


class Robo(Sprite, source=folha, hitbox_shape="rect"):
    def setup(self):
        self.vel = Vec2(0, 0)
        resolve(self, "chao", bounce=0)

    def on_update(self, dt):
        no_chao = "bottom" in self.touching_sides
        if keyp.once("UP") and no_chao:
            self.vel.y = 900
            play_sound("synth/jump.wav")
        self.vel.y -= 2200 * dt
        if no_chao:
            self.play("correndo")
        else:
            self.play("pulando")
        self.move_by(st.velocidade * dt, self.vel.y * dt)


class Corrida(Act):
    def setup(self):
        st.velocidade = 320
        chao = Rect(top_left=(0, 150), width=2400, height=150, color="sienna", group="chao")
        chao.mass = STATIC
        self.robo = Robo(center=(200, 300))

    def on_update(self, dt):
        canvas.pan_to(self.robo.center.x + 250, 270)


run(Corrida)

TERRA = Texture("k-textures/floor_ground_dirt.png", fit="tile", tile_size=64)
MADEIRA = Texture("textures/236.jpg", fit="tile", tile_size=64)
PEDRA = Texture("k-textures/wall_stone.png", fit="tile", tile_size=40)
MOITAS = ["tilesets/Object/Bush (1).png", "tilesets/Object/Bush (3).png", "tilesets/Object/Mushroom_1.png",
          "tilesets/Object/Mushroom_2.png", "tilesets/Object/Sign_2.png"]
SILHUETAS = ["castle.png", "tower.png", "tree01.png", "tree08.png", "tree11.png", "tree12.png", "house_side_tall.png"]


def altura(x):
    return 130 + 55 * sin(x / 400) + 25 * sin(x / 150)


def coluna(x):
    chao = Polygon(points=[(x, 0), (x + 64, 0), (x + 64, altura(x + 64)), (x, altura(x))], group="chao")
    chao.fill = TERRA
    chao.line = TERRA
    chao.mass = STATIC
    grama = Line(p1=(x, altura(x) - 4), p2=(x + 64, altura(x + 64) - 4), color="#6fa124", line_width=16)
    broto = Line(p1=(x, altura(x)), p2=(x + 64, altura(x + 64)), color="#b3d02a", line_width=8)
    return [chao, grama, broto]


def moedas(x, y):
    fila = []
    for k in range(3):
        fila.append(Circle(center=(x - 36 + 36 * k, y), radius=11, visual=Sphere("orange"), group="moeda"))
    return fila


def plataforma(slot, x, y):
    tabua = Rect(center=(x, y), width=128, height=24, group="tabua")
    tabua.mass = STATIC
    if slot.chance(0.5):
        tabua.fill = MADEIRA
        tabua.visual = Extrude(depth=20, angle=270)
    else:
        tabua.fill = PEDRA
        tabua.visual = Ink()
    return tabua


def trecho(slot):
    colunas = 6
    if slot.i > 1 and slot.chance(0.4):
        colunas = 3
    pecas = []
    for k in range(colunas):
        pecas += coluna(slot.left + 64 * k)
    if colunas == 3 and slot.chance(0.6):
        meio = slot.left + 288
        pecas.append(plataforma(slot, meio, altura(meio) + 100))
        pecas += moedas(meio, altura(meio) + 150)
    x = slot.rng.uniform(slot.left + 40, slot.left + 64 * colunas - 40)
    if slot.chance(0.4):
        pecas += moedas(x, altura(x) + 120)
    elif slot.i > 2 and slot.chance(0.5):
        pecas.append(Sprite("tilesets/Object/Crate.png", height=50, center=(x, altura(x) + 22), group="caixa"))
    else:
        pecas.append(Sprite(slot.rng.choice(MOITAS), height=40, center=(x, altura(x) + 16)))
    return pecas


def longe(slot):
    serra = Sprite(cenario, frame="pointy_mountains.png", width=1400, center=(slot.left + 700, 170))
    serra.set_alpha(0.6)
    nuvem = Sprite(cenario, frame=f"cloud{slot.rng.randint(1, 9)}.png", height=slot.rng.uniform(50, 80),
                   center=(slot.rng.uniform(slot.left, slot.right), slot.rng.uniform(400, 480)))
    return [serra, nuvem]


def colinas(slot):
    pecas = []
    for k in range(3):
        x = slot.rng.uniform(slot.left, slot.right)
        alto = slot.rng.uniform(120, 200)
        pecas.append(Sprite(cenario, frame=slot.rng.choice(SILHUETAS), height=alto, center=(x, 110 + alto / 2)))
    pecas.append(Sprite(cenario, frame="hills1.png", width=1000, center=(slot.left + 500, 64)))
    return pecas


st.recorde = 0


class Robo(Sprite, source=folha, hitbox_shape="rect", hitbox_anchor="bottom"):
    def setup(self):
        self.vel = Vec2(0, 0)
        self.tilt = "ground"
        resolve(self, "chao", bounce=0)
        resolve(self, "tabua", bounce=0, only="bottom")

    def on_update(self, dt):
        no_chao = "bottom" in self.touching_sides
        if keyp.once("UP") and no_chao:
            self.vel.y = 900
            play_sound("synth/jump.wav")
        self.vel.y -= 2200 * dt
        if not st.correndo:
            if not self.showing("caindo"):
                self.play("caindo", loops=1)
        elif no_chao:
            self.play("correndo")
        else:
            self.play("pulando")
        self.move_by(st.velocidade * dt, self.vel.y * dt)

    @collide_with("moeda")
    def pegou(self, moeda):
        moeda.destroy()
        st.moedas += 1
        play_sound("synth/coin.wav")

    @collide_with("caixa")
    def bateu(self, caixa):
        if st.correndo:
            st.correndo = False
            st.velocidade = 0
            canvas.shake(6)
            play_sound("audio/impactPlank_medium_002.ogg")

    @leave_playfield
    def caiu(self):
        st.correndo = False
        st.velocidade = 0


class Corrida(Act):
    def setup(self):
        st.velocidade = 320
        st.correndo = True
        st.moedas = 0
        st.metros = 0
        canvas.layers.create("longe", pan_response=0.1, below="default")
        canvas.layers.create("colinas", pan_response=0.3, below="default")
        canvas.layers.create("pista", below="default")
        Endless("longe", longe, step=1400)
        Endless("colinas", colinas, step=1000)
        Endless("pista", trecho, step=384)
        self.robo = Robo(center=(200, 300))
        placar = Text(text="", top_left=(16, 524), font_size=20, color="navy")
        placar["text"] @= lambda: f"{st.metros} m   Moedas {st.moedas}   Recorde {st.recorde} m"
        self.aviso = Text(text="", center=(480, 400), font_size=32, color="navy", layer="ui")

    def on_update(self, dt):
        canvas.pan_to(self.robo.center.x + 250, 270)
        canvas.playfield.set(canvas.game_view.outset(100))
        if st.correndo:
            st.velocidade += 6 * dt
            st.metros = int(self.robo.center.x / 64)
        elif keyp.once("SPACE"):
            change_act(Corrida)

    @when(lambda self: not st.correndo)
    def acabou(self):
        st.recorde = max(st.recorde, st.metros)
        self.aviso.text = "Aperte espaço"


run(Corrida)
`,
      try: [
        {
          note: "Outro fundo: a floresta da pasta <code>tilesets/BG/</code>, uma imagem só que se repete (o <code>Endless</code> de uma imagem, do 16). No lugar do <code>Endless</code> da serra:",
          replaces: ['Endless("longe"'],
          code: `Endless("longe", "tilesets/BG/BG.png", height=540)`
        }
      ],
      dive: [
        {
          title: "Duas referências",
          body: `
            <p>Todo jogo sem fim tem duas referências: o mundo (o chão, os buracos, as moedas) e a tela (o placar, o aviso). Neste jogo, a câmera anda e o mundo fica parado: cada peça é montada uma vez, onde fica, e o que é da tela vai na camada <code>ui</code>. No Avião (14 a 16) era o contrário: a câmera parada, as camadas andando com <code>scroll=</code>, e os pilares empurrados a cada quadro com <code>move_by</code>.</p>
            <p>Com a câmera andando, o resto vem com pouco: o parallax é o <code>pan_response</code> de cada camada; a área de jogo, uma linha por quadro (<code>playfield.set</code>); e o fim da corrida, parar o robô, que a câmera para junto.</p>
            <p>No Guia: <a href="../guide/index.html#mundo-sem-fim">Mundo sem fim</a> (a tabela "Dois jeitos de fazer um jogo sem fim") · <a href="../guide/index.html#mundo-camadas">Camadas</a> · <a href="../guide/index.html#mundo-camera">Câmera</a>.</p>
          `
        }
      ],
      closing: `
        <p>Seta para cima pula, só com os pés no chão. O robô corre sozinho, cada vez mais rápido: pule os buracos e as caixas e pegue as moedas no ar. Caindo num buraco ou batendo numa caixa, a corrida acaba; espaço recomeça, numa pista nova. O placar mostra os metros, as moedas e o recorde.</p>
      `,
      recap: `
        <ul>
          <li><code>Endless</code> com a câmera andando — monta cada vaga um pouco antes de ela entrar na tela e destrói as que ficaram para trás; numa camada neutra, as peças são o próprio mundo e colidem.</li>
          <li><code>Texture</code> — uma imagem que pinta uma forma, no <code>fill</code> e no <code>line</code>; <code>fit="tile"</code> a repete em ladrilhos; um visual por cima (<code>Extrude</code>, <code>Ink</code>) dá volume ou contorno.</li>
          <li><code>canvas.playfield.set(canvas.game_view.outset(100))</code> — a área de jogo refeita a cada quadro em volta da janela da câmera, para o <code>@leave_playfield</code> andar junto.</li>
          <li><code>altura(x)</code> — o que precisa casar entre vagas é uma função do x; o <code>slot.rng</code> é para o que fica dentro da vaga.</li>
          <li><code>tilt</code> — inclina só o desenho, para acompanhar a rampa.</li>
          <li><code>pan_response</code> com <code>Endless</code> — faixas de enfeite que andam menos que o mundo, montadas por vaga como a pista.</li>
        </ul>
        <p><strong>No Guia:</strong> <a href="../guide/index.html#mundo-sem-fim">Mundo sem fim</a> · <a href="../guide/index.html#reagir-bounds">@leave_playfield</a> · <a href="../guide/index.html#aparencia-cor">Cor / Gradient / Texture</a> · <a href="../guide/index.html#aparencia-visual">Visual</a> · <a href="../guide/index.html#sprite-orientar">Orientar sprites</a> · <a href="../guide/index.html#mundo-camadas">Camadas</a> · <a href="../guide/index.html#atos-trocar">change_act</a>.</p>
        <p><strong>No próximo:</strong> o último tutorial é de arte, não de jogo: giros que se somam, numa barra que cria barras e num ponto que desenha flores.</p>
      `
    }
  ]
