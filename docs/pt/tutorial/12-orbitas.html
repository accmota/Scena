        <p>Este tutorial é sobre <strong>movimento por caminhos</strong>, sem jogo: arte que se mexe sozinha. São dois scripts. No primeiro, um mostruário de trilhas: o que é uma trilha, as formas prontas, os caminhos seus e os jeitos de percorrê-los. No segundo, um sistema solar com planetas em órbita e uma sonda que aponta para o planeta mais perto.</p>
        <p><strong>A trilha.</strong> No letreiro do 04 você conheceu a <code>Track</code> (trilha): um caminho invisível que alguém percorre. Este script a vê a fundo. <code>Track.circle(center=(170, 520), radius=110)</code> é uma trilha em forma de círculo (<em>circle</em>), com centro e raio como o <code>Circle</code>. Ela não aparece na tela: é só o desenho do caminho, como o <code>Point</code> do 03 é só uma posição.</p>
        <p><strong>Presa num lugar.</strong> O oito do letreiro tinha só tamanho, e por isso começava onde o letreiro estava: era uma trilha <em>solta</em>. Esta tem <code>center=</code> e está <strong>presa</strong> num lugar da tela. Quem a percorre vai até ela; por isso a bola nem precisa de <code>center=</code>.</p>
        <p><strong>Percorrer.</strong> <code>bola.move_along(roda, time=4, loops="forever")</code> (mover ao longo de) é o do letreiro: uma volta inteira a cada 4 segundos (<code>time=4</code>) e, quando a volta acaba, outra (<code>loops="forever"</code>). Nenhuma linha no <code>update</code>: a bola anda sozinha.</p>
