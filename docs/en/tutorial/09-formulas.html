        <p>Think of a spreadsheet, like the ones in Excel or Google Sheets. Each cell has a name, like A1 or B1, and holds a number or a formula. If B1 holds the formula <code>=A1/3</code>, it shows a third of what is in A1. Change the number in A1, and B1 redoes the math on its own. Nobody tells B1 to update: the formula says where the value comes from, and the spreadsheet takes care of the rest.</p>
