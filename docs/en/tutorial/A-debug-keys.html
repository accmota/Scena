      title: "The keys",
      part: "The lab",
      body: `
        <p>Every Scena game comes with hidden keys that show what the game is doing inside. They answer the questions your eyes alone can't: how many things exist right now? Why did that meteor pass through the ship without hitting it? Where did the star that vanished go? That is what <em>debugging</em> means: finding out why a program does what it does.</p>
        <p>They are all <kbd>Ctrl+Shift</kbd> plus one key: hold Ctrl and Shift together and press the third. On a Mac it is the Control key too, not Command. They work in any Scena game, without writing anything, and they don't change the game; they only show it.</p>
        <div class="tbl"><table>
          <thead><tr><th>Key</th><th>What it does</th><th>When it helps</th></tr></thead>
          <tbody>
            <tr><td><kbd>Ctrl+Shift+1</kbd></td><td>The system HUD: frames per second, how many objects exist, where the mouse is.</td><td>Has the game slowed down? Is something that should be gone still there?</td></tr>
            <tr><td><kbd>Ctrl+Shift+2</kbd></td><td>Turns the automatic quality adjustment (FX Auto) off and on.</td><td>To compare the game with and without it.</td></tr>
            <tr><td><kbd>Ctrl+Shift+3</kbd></td><td>The quality of the effects: low → medium → high.</td><td>To see how much an effect costs.</td></tr>
            <tr><td><kbd>Ctrl+Shift+4</kbd></td><td>The framerate: vsync → vsync60 → vsync30 → 60 → 30 → max.</td><td>To see how the game runs on a slower computer.</td></tr>
            <tr><td><kbd>Ctrl+Shift+6</kbd></td><td>The process panel: off → tasks and modes → also the loose timers.</td><td>A sequence that stopped without a warning; a timer that does not fire.</td></tr>
            <tr><td><kbd>Ctrl+Shift+7</kbd></td><td>Draws the invisible: hitboxes, the design frame, the origin cross, the tracks and the playfield.</td><td>A collision that doesn't happen; a track that takes a strange turn.</td></tr>
            <tr><td><kbd>Ctrl+Shift+8</kbd></td><td>Zooms your view out (100% → 50% → 25%).</td><td>To see what happens outside the window.</td></tr>
            <tr><td><kbd>Ctrl+Shift+P</kbd></td><td>Time: running → paused → ¼ speed → running.</td><td>To take a calm look at a fast crash.</td></tr>
            <tr><td><kbd>Ctrl+Shift+E</kbd></td><td>Closes the warning banner (SCENA WARNING).</td><td>After you have read the warning.</td></tr>
            <tr><td><kbd>Ctrl+Shift+F</kbd></td><td>Fullscreen.</td><td></td></tr>
            <tr><td><kbd>Ctrl+Shift+M</kbd></td><td>Maximized window.</td><td></td></tr>
            <tr><td><kbd>Ctrl+Shift+Z</kbd></td><td>Quits the game.</td><td>In fullscreen, where there is no close button.</td></tr>
          </tbody>
        </table></div>
        <p>To see each key at work, let's build a small lab: a ship, falling meteors, a flying saucer that loops around. Each step adds one piece and the key that shows it from the inside. We start with the ship, which moves with the arrow keys.</p>
      `,
      code: `from scena import *

init(width=1000, height=700, title="Lab")
Wallpaper("dark navy")

ship = Sprite("space/playerShip1_red.png", width=70, center=(500, 100), group="ship")


def update(dt):
    if keyp("LEFT"):
        ship.move_by(-400 * dt, 0)
    if keyp("RIGHT"):
        ship.move_by(400 * dt, 0)


run()
`

from scena import *

init(width=1000, height=700, title="Lab")

def update(dt):

        ship.move_by(-400 * dt, 0)
    if keyp("RIGHT"):

    for meteor in group["meteors"]:

run()

      after: `
        <p>Run it and press <kbd>Ctrl+Shift+1</kbd>. The system panel appears in the corner: the HUD (short for <em>heads-up display</em>, a panel that sits on top of the game). Three of its readings:</p>
        <div class="tbl"><table><thead><tr><th>Reading</th><th>What it shows</th></tr></thead><tbody>
          <tr><td><code>FPS</code></td><td>(short for <em>frames per second</em>) how many times per second the screen is redrawn. Around 60 is normal; if it drops a lot, the game is too heavy for the computer (see <a href="#qualidade-e-quadros">Quality and framerate</a>).</td></tr>
          <tr><td><code>objs</code></td><td>how many things exist in the game right now: the ship, each meteor, each text.</td></tr>
          <tr><td><code>xy</code></td><td>where the mouse is, in the same units as your code.</td></tr>
        </tbody></table></div>
        <details class="ask"><summary>Watch <code>objs</code> for half a minute. What does it do?</summary><p>It only goes up. The meteors that pass the bottom of the screen vanish from view, but they still exist and keep falling forever. A program that creates things and never removes them has a <em>leak</em>: it gets heavier every second, and <code>objs</code> is the quickest way to find out.</p></details>
        <p><code>xy</code> works as a ruler too. Want to put something near the top right corner and don't know which numbers to write? Move the mouse there and read it: something like (900, 620). That is the <code>center=(…)</code> you are looking for.</p>
      `

from scena import *

init(width=1000, height=700, title="Lab")
Wallpaper("dark navy")

ship = Sprite("space/playerShip1_red.png", width=70, center=(500, 100), group="ship")


@every(0.5)

    x = uniform(60, 940)
    Sprite("space/meteorBrown_big3.png", size=60, center=(x, 760), group="meteors")


def update(dt):
    if keyp("LEFT"):
        ship.move_by(-400 * dt, 0)
    if keyp("RIGHT"):
        ship.move_by(400 * dt, 0)
    for meteor in group["meteors"]:
        meteor.move_by(0, -250 * dt)


@leave_playfield("meteors")
def gone(meteor):
    meteor.destroy()


run()

        <p>Where exactly is the meteor removed? Press <kbd>Ctrl+Shift+8</kbd>: the view zooms out to 50%. Once more, 25%; once more, back to normal. Zoomed out, the window becomes a frame in the middle, and you see what happens outside it: the meteors appearing above the top edge and falling past the bottom edge until they vanish.</p>
        <figure class="fig">
          <svg viewBox="-21 0 341 212" role="img" aria-label="A small rectangle, the window, inside a larger dashed rectangle, the playfield; dots above and below the window, still inside the playfield, and one dot that has just crossed the bottom edge of the playfield">

            <text x="160" y="17" text-anchor="middle">playfield</text>
            <circle class="dot" cx="120" cy="38" r="5"/>

            <circle class="dot" cx="140" cy="140" r="5"/>

        <p>The playfield (<code>canvas.playfield</code>) is larger than the screen so that something that goes out a little and comes back isn't removed by mistake. Press <kbd>Ctrl+Shift+7</kbd> with the view zoomed out: the playfield is drawn in cyan.</p>
        <p>The 8 changes neither the game nor the camera; only your view. The meteors keep falling, and the collisions stay the same.</p>
      `,

init(width=1000, height=700, title="Lab")

      after: `
        <p>Run it, press <kbd>Ctrl+Shift+7</kbd> and let a few meteors pass close to the ship. A thin outline appears over each image: the <strong>hitbox</strong>, the shape Scena uses to decide whether two things touch. A collision doesn't look at the drawing; it looks at that shape. The color tells the kind:</p>
        <div class="tbl"><table><thead><tr><th>Color</th><th>The hitbox</th></tr></thead><tbody>
          <tr><td>green</td><td>only reports the touch, like the <code>@collide</code> here</td></tr>
          <tr><td>gold</td><td>solid, doesn't let things through (<code>resolve</code>)</td></tr>
          <tr><td>cyan</td><td>an extra part of the body (<code>add_hitbox</code>)</td></tr>
        </tbody></table></div>
        <details class="ask"><summary>A meteor grazed the wing and nothing happened. Why?</summary><p>For an image, Scena computes the hitbox from the drawing's pixels and would rather err on the inside: the wing tips and the edges of the meteor can be left out. With the 7 on, you see that the two shapes didn't touch. It is the first key to press when a collision surprises you, either way.</p></details>
        <p>The same drawing shows two more things. The frame is the rectangle of <code>init</code>, 1000 × 700: everything inside it appears in the window. The cross marks the origin, the point (0, 0), in the bottom left corner. With the view zoomed out (8), the two show where the screen ends and where the world goes on.</p>
