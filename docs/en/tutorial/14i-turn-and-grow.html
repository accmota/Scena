                <tr><td><code>scale_to(1.5)</code></td><td>scales to 1.5 (1 is the starting size)</td><td>the center, or <code>about=</code></td></tr>
                <tr><td><code>scale_by(1.5)</code></td><td>multiplies the scale by 1.5</td><td>the center, or <code>about=</code></td></tr>
                <tr><td><code>scale = 1.5</code></td><td>the same as <code>scale_to(1.5)</code></td><td>the center</td></tr>
              </tbody>
            </table></div>
            <p>The difference is always in the point that stays still. On a shape placed by its center, which is the case for almost every <code>Sprite</code> in the series, the field and the verb turn the same way. On a shape placed by a corner or an end, the field turns around that point, and the verb around the center. On a shape pinned by its corners with formulas, only the field works.</p>
            <p>In the Guide: <a href="../guide/index.html#mover-pose">move / rotate / scale</a> · <a href="../guide/index.html#suite">Time parameters (time=)</a>.</p>
          `
