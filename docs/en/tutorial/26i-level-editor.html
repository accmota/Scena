        <p>In Ninja III, the level came ready-made: the code only read the file. In this interlude you make a level from scratch, a minigolf course seen from above, and learn to read every kind of piece the editor can draw.</p>
        <p>The level editor comes with Scena. In the terminal, in your game's folder, open a file that doesn't exist yet:</p>
        <p><code>python -m scena_editor media/levels/my_golf.json</code></p>
        <p>(or <code>scena-editor media/levels/my_golf.json</code>). The editor opens an empty level, and the file is created when you save: the <em>Save</em> button, or <kbd>Cmd</kbd>/<kbd>Ctrl</kbd>+<kbd>S</kbd>.</p>
        <figure class="fig">

            <text x="20" y="23">New · Open · Save │ Undo · Redo │ Snap to grid</text>

            <rect class="bar child" x="96" y="132" width="70" height="40" rx="2"/>
            <circle class="dot" cx="226" cy="96" r="14"/>

            <rect class="bar" x="300" y="36" width="130" height="182" rx="4"/>

        <p>With nothing selected, the right panel shows <em>Level</em>, with <em>Width</em> and <em>Height</em>: the size of the level, the border in the middle of the screen. Start there. Then pick a tool, drag inside the border, and give each piece a name and groups in the panel. The box at the end of this step lists the tools and the panel.</p>

            <p>To change what is already drawn, use <em>Select</em> (<kbd>V</kbd>): click a piece and drag it, or pull its handles. <kbd>Esc</kbd> also goes back to <em>Select</em>, and <kbd>Space</kbd> + drag moves the view.</p>

            <p>In the Guide: <a href="../guide/index.html#colocar-fase">Level and the level editor</a>.</p>
