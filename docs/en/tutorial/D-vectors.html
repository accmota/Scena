        <p>This appendix does not build a game. Each section is a short program that shows one idea about <strong>points</strong> (places on the screen) and <strong>vectors</strong> (arrows: which way to go and how far). Run each one, change the numbers and run it again. The math here turns up in every game: the ball that moves, the ship that aims at the enemy, the shot that leaves the tip of the cannon.</p>
        <p>A point is a pair of numbers, <code>(x, y)</code>. <code>x</code> grows to the right; <code>y</code> grows <strong>upward</strong>. The point <code>(0, 0)</code> is the bottom left corner. In a 1000 by 700 window, the top right corner is <code>(1000, 700)</code>, and the middle is <code>(500, 350)</code>.</p>
