            self.flip_x = True

            self.flip_x = False

        elif self.vel.x != 0:

        else:

    @collide_with("star")
    def caught(self, star):

    def crashed(self, robot):

    @when(lambda self: self.center.y < 30)
    def fell(self):

    def lose(self):
        if st.lives == 0:
            return
        st.lives -= 1
        canvas.shake(6)
        if st.lives > 0:
            play_sound("audio/sfx-hit-2.wav")
            self.center = (100, 400)
            self.vel = Vec2(0, 0)
            self.blink(1)
        else:
            play_sound("audio/gameover.wav")
            notice.text = "GAME OVER"
