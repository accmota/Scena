from scena import *

init(width=640, height=360, title="Plane")
Wallpaper("backgrounds/mountains/mountains1.png")

sheet = Sheet("plane/Fly1.png", "plane/Fly2.png", "plane/Dead.png")
sheet.clip("flying", [0, 1], fps=12)
sheet.clip("falling", [2])
pieces = Sheet("k-rolling-ball/rollingBall_sheet@2.png", atlas="k-rolling-ball/rollingBall_sheet@2.xml")

st.score = 0
st.flying = True

scoreboard = Text(text="", top_left=(16, 346), font_size=18, color="navy")
scoreboard["text"] @= lambda: f"Score {st.score}"
notice = Text(text="", center=(320, 200), font_size=24, color="navy")


class Plane(Sprite, source=sheet, height=40):
    def setup(self):
        self.play("flying")

    def on_update(self, dt):
        if st.flying:
            goal = 0
            if keyp("UP"):
                goal = 30
            if keyp("DOWN"):
                goal = -30
            self.rotate_to(chase(self.angle, goal, rate=4))
            arrow = vec_from_angle(self.angle, length=220)
            self.move_by(0, arrow.y * dt)
            self.confine(canvas.game_view)
            if self.center.y < 30:
                self.fall()
        elif self.center.y > 30:
            self.rotate_to(chase(self.angle, -60, rate=3))
            self.move_by(0, -160 * dt)

    @collide_with("door")
    def passed(self, door):
        door.destroy()
        st.score += 1
        play_sound("audio/fx2.wav")

    @collide_with("pillar")
    def crashed(self, pillar):
        if st.flying:
            self.fall()

    def fall(self):
        st.flying = False
        self.play("falling")
        canvas.shake(6)
        play_sound("audio/explosion02.wav")
        notice.text = "press SPACE"


plane = Plane(center=(120, 200))


def new_pair():
    mid = uniform(110, 250)
    Sprite(pieces, frame="block_narrow.png", height=260, center=(680, mid + 190), group="pillar")
    Sprite(pieces, frame="block_narrow.png", height=260, center=(680, mid - 190), group="pillar")
    door = Rect(center=(690, mid), width=10, height=120, group="door")
    door.visible = False


@every(2)
def more_pillars():
    if st.flying:
        new_pair()


def restart():
    group["pillar"].destroy()
    group["door"].destroy()
    st.score = 0
    st.flying = True
    notice.text = ""
    plane.center = (120, 200)
    plane.rotate_to(0)
    plane.play("flying")


def update(dt):
    if st.flying:
        group["pillar"].move_by(-120 * dt, 0)
        group["door"].move_by(-120 * dt, 0)
    elif keyp("SPACE"):
        restart()


@leave_playfield("pillar", "door")
def gone(thing):
    thing.destroy()


run()

music = play_sound("audio/SuperHero_original_no_Intro.ogg", loops="forever", volume=0.5)

scoreboard = Text(text="", top_left=(16, 346), font_size=18, color="navy")
scoreboard["text"] @= lambda: f"Score {st.score}"
notice = Text(text="", center=(320, 200), font_size=24, color="navy")


class Plane(Sprite, source=sheet, height=40):
    def setup(self):
        self.play("flying")

    def on_update(self, dt):
        if st.flying:
            goal = 0
            if keyp("UP"):
                goal = 30
            if keyp("DOWN"):
                goal = -30
            self.rotate_to(chase(self.angle, goal, rate=4))
            arrow = vec_from_angle(self.angle, length=220)
            self.move_by(0, arrow.y * dt)
            self.confine(canvas.game_view)
            if self.center.y < 30:
                self.fall()
        elif self.center.y > 30:
            self.rotate_to(chase(self.angle, -60, rate=3))
            self.move_by(0, -160 * dt)

    @collide_with("door")
    def passed(self, door):
        door.destroy()
        st.score += 1
        play_sound("audio/fx2.wav")

    @collide_with("pillar")
    def crashed(self, pillar):
        if st.flying:
            self.fall()

    def fall(self):
        st.flying = False
        self.play("falling")
        canvas.shake(6)
        play_sound("audio/explosion02.wav")
        self.move_to_front()
        self.fire = Fire(center=lambda: self.center + Vec2(-20, 8).rotate(self.angle), width=12, style="tongues")
        notice.text = "press SPACE"
        music.fade_to(0.1, time=1)


plane = Plane(center=(120, 200))


def new_pair():
    mid = uniform(110, 250)
    Sprite(pieces, frame="block_narrow.png", height=260, center=(680, mid + 190), group="pillar")
    Sprite(pieces, frame="block_narrow.png", height=260, center=(680, mid - 190), group="pillar")
    door = Rect(center=(690, mid), width=10, height=120, group="door")
    door.visible = False


@every(2)
def more_pillars():
    if st.flying:
        new_pair()


def restart():
    group["pillar"].destroy()
    group["door"].destroy()
    st.score = 0
    st.flying = True
    st.pace = 120
    notice.text = ""
    plane.center = (120, 200)
    plane.rotate_to(0)
    plane.play("flying")
    plane.fire.destroy()
    music.fade_to(0.5, time=1)


def update(dt):
    if not st.flying:
        st.pace = chase(st.pace, 0, rate=2)
        if keyp("SPACE"):
            restart()
    group["pillar"].move_by(-st.pace * dt, 0)
    group["door"].move_by(-st.pace * dt, 0)
    clouds.scroll = (-st.pace * 0.1, 0)
    hills.scroll = (-st.pace * 0.3, 0)
    bushes.scroll = (-st.pace * 0.7, 0)


@leave_playfield("pillar", "door")
def gone(thing):
    thing.destroy()


run()

        },

          at: "music.fade_to(0.1, time=1)",
          text: "<code>fade_to</code> lowers the volume to 0.1 over one second, without cutting it off: during the fall, the music almost disappears."
        },
        {
          at: "music.fade_to(0.5, time=1)",
          text: "On restart, the music goes back to 0.5."
        }
      ],
      after: `
        <p>Run it with the sound on, fly and crash.</p>

      closing: `

      recap: `
        <ul>
          <li><code>canvas.layers.create</code> — a named layer; <code>scroll=</code> makes it move on its own, and <code>below="default"</code> puts it behind the game.</li>
          <li><code>Endless</code> — fills the layer with the same image, one after the other, without end; <code>height=</code> is the size of each one.</li>
          <li>Parallax — what is far away moves slower: each layer moves at a fraction of the flight's speed.</li>
          <li><code>.scroll</code> — the layer's speed can change at any moment; with <code>chase</code>, everything slows down together.</li>
          <li><code>Fire</code> with <code>center=lambda: …</code> — an effect that follows an object.</li>
          <li><code>loops="forever"</code> and <code>fade_to</code> — music that repeats, and a volume that changes gradually.</li>
