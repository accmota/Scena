            <p>The extras take similar settings, such as the color, the amount and how far the field moves on its own; the examples below show some, and the Guide has them all. To change or remove an extra later, keep what the line returns: <code>clouds = Clouds()</code>, and later <code>clouds.remove()</code>.</p>

            <p>Each effect has a number that sets its strength: <code>Grain(amount=0.07)</code> is the speckle; <code>Bloom(intensity=0.6, sigma=10)</code>, where <code>intensity</code> is the light that leaks and <code>sigma</code> is how far it reaches; <code>Scanlines(amount=1.0)</code>. Each effect is one more pass over the picture: turn on the ones the game needs. To remove them all, <code>canvas.effects.clear()</code>.</p>
