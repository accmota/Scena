      title: "Design units",
      part: "The window",
      body: `
        <p>This appendix gathers general commands that any game can use: the window's size and mode, the background, colors, random picks, the clock, and the values you want to peek at while the game runs. Each section is a short program to run and change.</p>
        <p>The first one is the game's ruler: the numbers <code>init</code> picks, and where the corners and the middle of the screen are.</p>
      `,
      code: `from scena import *

init(width=800, height=600, title="My window")
Wallpaper("dark navy")

Circle(center=(0, 0), radius=40, color="coral")
Circle(center=(400, 300), radius=40, color="white")
Circle(center=(800, 600), radius=40, color="gold")

Text("(0, 0)", top_left=(50, 80), font_size=24)
Text("(400, 300)", top_center=(400, 250), font_size=24)
Text("(800, 600)", top_right=(750, 560), font_size=24)

run()
`,
      notes: [
        {
          at: "init(width=800, height=600, title=\"My window\")",
          text: "<code>width</code> and <code>height</code> are not monitor pixels: they are the game's ruler, the <em>design units</em>. x goes from 0 (left edge) to 800 (right edge), y from 0 (bottom) to 600 (top). <code>title</code> is the text in the window's title bar."

init(width=800, height=600, title="Window modes")
Wallpaper("dark navy")

border = Rect(center=(400, 300), width=800, height=600, line_width=8)
border.fill = None
border.line = "gold"

Text("1  windowed\\n2  maximized\\n3  fullscreen", center=(400, 300), font_size=32)
mode = Text("", top_left=(20, 580), font_size=24)


def update(dt):

        canvas.display = "maximized"
    if keyp.once("3"):

run()

      title: "Confetti",
      part: "Random picks",
      fresh: true,
      body: `
        <p>Games need surprise: the enemy that shows up in a different place, the gift that falls now and then. Here, every 0.3 seconds, a piece of confetti lands on the screen, and every detail of it is random.</p>
      `,
      code: `from random import uniform, randint, choice
from scena import *

init(width=900, height=600, title="Random")
Wallpaper("dark navy")

COLORS = ["coral", "gold", "orchid", "deep sky blue"]


@every(0.3)
def confetti():
    x = uniform(50, 850)
    y = uniform(50, 550)
    radius = randint(10, 40)
    dot = Circle(center=(x, y), radius=radius, color=choice(COLORS))
    if chance(0.1):
        dot.glow = True
    dot.after(3, dot.destroy)


run()

init(width=800, height=600, title="Clock")
Wallpaper("dark navy")

stopwatch = Text("", top_left=(20, 580), font_size=28)
stopwatch["text"] @= lambda: f"{clock.time:.1f} s"

def update(dt):

        clock.scale = 1
    if keyp.once("P"):
        clock.paused = not clock.paused


run()

        <div class="tbl"><table><thead><tr><th>Keys</th><th>Names</th></tr></thead><tbody>
          <tr><td>letters and digits</td><td>themselves: <code>"A"</code>, <code>"7"</code>; upper or lower case doesn't matter</td></tr>
          <tr><td>arrows</td><td><code>"LEFT"</code>, <code>"RIGHT"</code>, <code>"UP"</code>, <code>"DOWN"</code></td></tr>

          <tr><td>Shift, Ctrl, Alt, Command</td><td><code>"SHIFT"</code>, <code>"CTRL"</code>, <code>"ALT"</code>, <code>"CMD"</code></td></tr>
          <tr><td>punctuation</td><td><code>"K1"</code> to <code>"K12"</code>, a number instead of the symbol, because the printed symbol changes from one keyboard to another. On a Brazilian keyboard (ABNT2), the Ç is <code>"K7"</code></td></tr>

        <details class="ask"><summary>Hold Ctrl and press R. What shows up?</summary><p>Only Ctrl: with Ctrl or Shift held, the letter doesn't reach this function. For a combination, use <code>keyp</code> with <code>+</code>: <code>keyp.once("CTRL+R")</code>.</p></details>

    {
      title: "Volume and mute",
      part: "Volume",
      fresh: true,
      body: `
        <p>Every game with music deserves a mute key. <code>audio</code> is the sound of the whole game, all the <code>play_sound</code> calls together: the M key mutes it, and the arrows turn the volume up and down.</p>
      `,
      code: `from scena import *

init(width=800, height=600, title="Volume")
Wallpaper("dark navy")

play_sound("music/super_hero_original_no_intro.ogg", loops="forever")
info = Text("", top_left=(20, 580), font_size=24)


def update(dt):
    if keyp.once("M"):
        audio.muted = not audio.muted
    if keyp.once("UP"):
        audio.volume = min(1, audio.volume + 0.1)
    if keyp.once("DOWN"):
        audio.volume = max(0, audio.volume - 0.1)
    info.text = f"volume {audio.volume:.1f}   muted: {audio.muted}"


run()
`,
      notes: [

          text: "<code>audio.muted</code> silences everything when <code>True</code> and brings the sound back when <code>False</code>; <code>not</code> switches from one to the other."
        },
        {
          at: "min(1, audio.volume + 0.1)",
          text: "<code>audio.volume</code> is the overall volume: 1 is normal, 0 is silence. <code>min</code> gives back the smaller of the two numbers, so the volume never goes above 1."
