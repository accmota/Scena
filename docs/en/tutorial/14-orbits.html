            <p>You have already animated things over time: <code>move_to</code> and <code>move_by</code> (position), <code>rotate_by</code> (angle), <code>scale_to</code> (size), all with <code>time=</code>. They are named verbs, one for each thing, and they take care of what is special about each.</p>
            <p><code>tween</code> is the general case: it animates any number of an object, even ones with no verb, such as the radius, the <code>line_width</code> or a number of your own. For position, angle and size, prefer the verb; for the rest, <code>tween</code>, with the same time parameters.</p>
