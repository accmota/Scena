        <p>The first is <code>lerp(a, b, t)</code>: the value a fraction <code>t</code> of the way from <code>a</code> to <code>b</code>. With <code>t = 0</code>, it is <code>a</code> itself; with <code>t = 1</code>, it is <code>b</code>; with <code>0.5</code>, the middle; with <code>0.25</code>, a quarter of the way, closer to <code>a</code>. The name is short for <em>linear interpolation</em>: filling in the straight path between two values.</p>

Wallpaper("dark navy")


def chaser(rate, color):
    ball = Circle(center=(500, 350), radius=20, color=color)
    ball.rate = rate
    Text(f"rate={rate}", center=lambda: ball.center + (0, 38), font_size=16)
    return ball


balls = [chaser(1, "orchid"), chaser(4, "coral"), chaser(12, "gold")]


def update(dt):
    for ball in balls:

run()
