init(width=1000, height=600, title="Piano")
Wallpaper("dark navy")

LETTERS = ["A", "S", "D", "F", "G", "H", "J", "K"]
NOTES = [1, 1.12, 1.26, 1.33, 1.5, 1.68, 1.89, 2]


class Key(Rect, width=110, height=300, color="#F2EFE6", group="keys"):
    def on_update(self, dt):
        if keyp.once(self.letter):

    def play_note(self):

run()

      code: `from scena import *

init(width=1000, height=600, title="Piano")
Wallpaper("dark navy")

LETTERS = ["A", "S", "D", "F", "G", "H", "J", "K"]
NOTES = [1, 1.12, 1.26, 1.33, 1.5, 1.68, 1.89, 2]


class Key(Rect, width=110, height=300, color="#F2EFE6", group="keys"):
    def on_update(self, dt):
        if keyp.once(self.letter):
            self.play_note()

    def play_note(self):
        play_sound("audio/nota.wav", pitch=self.note, on_done=self.dim)
        self.color = "gold"

    def dim(self):
        self.color = "#F2EFE6"


for i in range(8):
    key = Key(center=(94 + i * 116, 190))
    key.letter = LETTERS[i]
    key.note = NOTES[i]
    Text(text=LETTERS[i], center=(94 + i * 116, 70), font_size=28, color="dim gray")

run()

      code: `from scena import *

init(width=1000, height=600, title="Piano")
Wallpaper("dark navy")

LETTERS = ["A", "S", "D", "F", "G", "H", "J", "K"]
NOTES = [1, 1.12, 1.26, 1.33, 1.5, 1.68, 1.89, 2]


class Key(Rect, width=110, height=300, color="#F2EFE6", group="keys"):
    def on_update(self, dt):
        if keyp.once(self.letter):
            self.play_note()

    def on_click(self):
        self.play_note()

    def play_note(self):
        play_sound("audio/nota.wav", pitch=self.note, on_done=self.dim)
        self.color = "gold"

    def dim(self):
        self.color = "#F2EFE6"


for i in range(8):
    key = Key(center=(94 + i * 116, 190))
    key.letter = LETTERS[i]
    key.note = NOTES[i]
    Text(text=LETTERS[i], center=(94 + i * 116, 70), font_size=28, color="dim gray")

run()

      `,

def clicked(key):

        `
        <p>So far the screen shows the key. Now it will show the sound itself, in a row of jumping bars, like on the panel of a stereo. The numbers come from one line:</p>
        `,

        `
        <p><code>audio</code> is the sound of the whole game: everything playing right now, added up. <code>spectrum</code> splits that sound into bands, and <code>bins=12</code> asks for 12 of them, from the lows (the deep sounds) on the left to the highs (the thin ones) on the right. The answer is a list of 12 numbers from 0 to 1: how much sound there is in each band at this moment.</p>
        <figure class="fig">

            <rect class="bar" x="202" y="74" width="20" height="26"/>
            <rect class="bar" x="230" y="86" width="20" height="14"/>
            <rect class="bar" x="258" y="90" width="20" height="10"/>
            <rect class="bar" x="286" y="88" width="20" height="12"/>
            <rect class="bar" x="314" y="94" width="20" height="6"/>

            <text x="44" y="116" text-anchor="middle">[0]</text>
            <text x="352" y="116" text-anchor="middle">[11]</text>
            <text x="44" y="136" text-anchor="middle">lows</text>
            <text x="352" y="136" text-anchor="middle">highs</text>
          </svg>
          <figcaption>The list <code>bands</code> at one instant: one number per band, from lows to highs. Each bar in the script shows one of them.</figcaption>
        </figure>
        `
      ],
      code: `from scena import *

init(width=1000, height=600, title="Piano")
Wallpaper("dark navy")

LETTERS = ["A", "S", "D", "F", "G", "H", "J", "K"]
NOTES = [1, 1.12, 1.26, 1.33, 1.5, 1.68, 1.89, 2]


class Key(Rect, width=110, height=300, color="#F2EFE6", group="keys"):
    def on_update(self, dt):
        if keyp.once(self.letter):
            self.play_note()

    def on_click(self):
        self.play_note()

    def play_note(self):
        play_sound("audio/nota.wav", pitch=self.note, on_done=self.dim)
        self.color = "gold"

    def dim(self):
        self.color = "#F2EFE6"


for i in range(8):
    key = Key(center=(94 + i * 116, 190))
    key.letter = LETTERS[i]
    key.note = NOTES[i]
    Text(text=LETTERS[i], center=(94 + i * 116, 70), font_size=28, color="dim gray")

bars = []
for i in range(12):
    bars.append(Rect(center=(82 + i * 76, 470), width=60, height=4, color="turquoise"))


def update(dt):
    bands = audio.spectrum(bins=12)
    for i in range(12):
        bars[i].height = 4 + 150 * amp_db(bands[i])


run()
`,
      notes: [
        {
          at: "bars.append(Rect(",
          text: "Twelve short rectangles, one per band, kept in the list <code>bars</code> so that <code>update</code> can find them."

          at: "4 + 150 * amp_db(bands[i])",
          text: "Every frame, each bar gets the height of its band: 4, plus up to 150. <code>amp_db</code> puts the number on the ear's scale; without it, a quiet sound would barely move the bar. The bar grows from its center, up and down."

      after: `
        <p>Run it and play. A lights up the bars on the left; as you go up to K, the light moves to the right.</p>

      `,
      try: [
        {
          note: "A single bar, with the volume of all the sound: <code>audio.level</code>, from 0 to 1. The width is linked with <code>@=</code>, and the bar follows the sound. At the end of the program.",
          code: `meter = Rect(center=(500, 575), width=10, height=12, color="gold")
meter["width"] @= lambda: 10 + 900 * amp_db(audio.level)`
        }

      closing: `
        <p>The letters A S D F G H J K play the eight notes, from C to the next C; a click on a key plays it too. The key turns gold while its note sounds, and the bars above show the sound in bands, from lows to highs.</p>
      `,
      recap: `
        <ul>
          <li><code>pitch=</code> — how high the sound plays: 1 is the sound as recorded; 2 plays twice as fast, an octave higher.</li>
          <li><code>key.note</code> — a field: each key keeps its own note.</li>
          <li><code>keyp.once(self.letter)</code> — each key asks about its own letter, once per press.</li>
          <li><code>on_done=</code> — the sound calls the function when it ends: the key goes dark.</li>
          <li><code>on_click</code> — each key's click, a method of the class.</li>
          <li><code>audio.spectrum</code> — the game's sound in bands, from lows to highs; <code>amp_db</code> puts it on the ear's scale.</li>
        </ul>

        <p><strong>Next:</strong> the piano plays your voice, and a star dances with a light that grows when you speak.</p>
