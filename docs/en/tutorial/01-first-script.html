Tutorial.mount({
  n: "01",
  title: "First script",
  steps: [
    {
      title: "The window",
      body: `
        <p>A Scena script is an ordinary Python file: you write the lines, save, and run it, and Scena takes care of the window, the drawing, the keyboard, and the mouse. Your first one has three lines, and all three will be in every script you write.</p>
      `,
      code: `from scena import *

init(width=1000, height=700, title="Mouse and keyboard")

run()
`,
      notes: [
        {
          at: "from scena import *",
          text: "Brings everything Scena offers into your file: shapes, colors, keyboard, mouse. The <code>*</code> means “everything”; thanks to it, you write names like <code>Circle</code> directly, with no prefix."
        },
        {
          at: "init(",
          text: "<code>init</code> (short for <em>initialize</em>) prepares the window but does not open it yet. <code>width</code> and <code>height</code> give the size of the drawing area; <code>title</code> is the text in the window's title bar."
        },
        {
          at: "run()",
          text: "<code>run</code> opens the window and sets the game going: many times a second, Scena reads the keyboard and the mouse and redraws the screen, until you close the window. That is why <code>run()</code> is always the last line, and everything you create comes before it."
        }
      ],
      after: `
        <p>Copy it, save it as <code>first.py</code>, and run it (<code>python first.py</code>). An empty window opens, with a black background and the title “Mouse and keyboard”. Close the window to end the script.</p>
        <p>Inside the parentheses of <code>init</code>, each piece of information goes in as <code>name=value</code>, separated from the next by a comma: <code>width=1000</code> means “the width is 1000”. With the name written out, the order does not matter, and whatever you leave out gets a default value that Scena chooses.</p>
        <details class="ask"><summary>Is the window 1000 pixels of your monitor wide?</summary><p>No. The 1000 × 700 are the units you will place everything with, and Scena fits the window to your screen: on a big monitor or a small one, the drawing comes out the same. When a tutorial says something measures 80, it means 80 of these units.</p></details>
      `,
      try: [
        {
          note: "In place of the <code>init</code> line: another drawing area, wider than it is tall, and another title. This is all that changes from one window to another.",
          code: `init(width=800, height=500, title="My game")`
        }
      ]
    },
    {
      title: "The background",
      body: `
        <p>The window opened black. Before drawing anything, let's give the background a color.</p>
      `,
      code: `from scena import *

init(width=1000, height=700, title="Mouse and keyboard")
Wallpaper("dark navy")

run()
`,
      notes: [
        {
          at: "Wallpaper(",
          text: "<code>Wallpaper</code> is the window's background, behind everything that gets drawn. The line alone changes the background: you do not need to store anything in a variable or call anything else."
        },
        {
          at: "\"dark navy\"",
          text: "A color name: <code>navy</code> is a deep blue, and <code>dark</code> in front makes the color darker."

      after: `

        <details class="ask"><summary>What if you misspell it, as in <code>"dark navi"</code>?</summary><p>The script runs anyway: Scena warns in the console and suggests the closest name. When something does not come out as expected, look at the console first.</p></details>
      `,
      try: [
        {
          note: "One at a time, in place of the <code>Wallpaper</code> line. The first is a hex (hexadecimal) color, which the Color step explains. The second is a <code>Gradient</code>, which goes from black at the bottom to navy at the top: <code>angle=90</code> makes the gradient run vertically, from bottom to top, instead of from left to right.",

            <line class="ray" x1="130" y1="258" x2="124" y2="254"/>

            <line class="ray" x1="36" y1="150" x2="32" y2="156"/>
            <line class="ray" x1="36" y1="150" x2="40" y2="156"/>

init(width=1000, height=700, title="Mouse and keyboard")

rectangle = Rect(center=(160, 480), width=90, height=70)

      notes: [
