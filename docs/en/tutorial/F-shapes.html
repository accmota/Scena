      title: "Five ways to make a circle",
      part: "Circle",
      body: `
        <p>This appendix shows Scena's shapes and the ways to put each one on the screen. Each section is a program that draws the variants of one shape side by side, each with its name underneath. Run it, change the numbers, and run it again.</p>
        <p>A shape can be given in several ways: by its center and size, by a corner, by two points. Each way is a <strong>construction model</strong>. The drawing may come out the same, but the shape keeps different things, and that shows when you drag it or link it to another one.</p>
        <p>First, five models of the <code>Circle</code>.</p>
      `,
      code: `from scena import *

init(width=1000, height=700, title="Circle")
Wallpaper("dark navy")

normal = Circle(center=(100, 420), radius=70, color="coral")
Text("center, radius", center=(100, 310), font_size=15)
by_edge = Circle(center=(290, 420), perimeter_point=(340, 470), color="gold")
Text("center, perimeter_point", center=(290, 310), font_size=15)
diameter = Circle(p1=(430, 420), p2=(570, 420), color="turquoise")
Text("p1, p2", center=(500, 310), font_size=15)
wedge = Circle(center=(710, 420), radius=70, angle=180, spread=300, color="orchid")
Text("angle, spread", center=(710, 310), font_size=15)
segment = Circle(center=(900, 420), radius=70, angle=90, spread=240, use_center=False, color="sky blue")
Text("use_center=False", center=(900, 310), font_size=15)

run()
`,

            <tr><td><code>p1</code>, <code>p2</code></td><td>The two ends of a diameter, the line that crosses the circle through the middle.</td></tr>
