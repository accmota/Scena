          body: `
            <p>If you have read about Python classes elsewhere, you may have seen <code>def __init__(self):</code>, with two underscores on each side. <code>__init__</code> (short for <em>initialize</em>) is the name Python reserves for the function that builds the object, at the moment of <code>Bubble(…)</code>. It looks like the right place for the speed. In a Scena class, it is not.</p>
            <p>Try it: change <code>def setup(self):</code> to <code>def __init__(self):</code> and run. The program stops at creation. The Scena circle already has its own <code>__init__</code>: that is what receives <code>center</code> and <code>radius</code>, puts the circle in the world and hands it to Scena to be drawn and updated. Your <code>__init__</code> took its place, and yours does not know what <code>center</code> is. The error message says so and already gives the way out: remove the <code>__init__</code> and write <code>def setup(self)</code>.</p>
            <p>With <code>setup</code>, you do not touch the building: Scena builds the whole object and, when it is ready, calls your <code>setup</code>. Hence the rule: in a class of your own, never <code>__init__</code>; what the object does when it is born goes in <code>setup</code>.</p>
            <p>In the Guide: <a href="../guide/index.html#reagir-callbacks-entity">Entity callbacks</a>.</p>
