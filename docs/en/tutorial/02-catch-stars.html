          <li><code>group</code> — a name that gathers things; <code>group["stars"]</code> is whoever is in it now, with no list to look after.</li>
          <li><code>@collide</code> — runs when something in one group touches something in another; <code>destroy</code> takes the thing out of the game.</li>
          <li>What leaves the screen without being removed leaks: the HUD (<code>objs</code>) shows the count, and the <code>if</code> on the height fixes it.</li>
          <li><code>st</code> and <code>@=</code> — <code>st</code> keeps the game's data; <code>@=</code> links the scoreboard's text to a formula, which stays true on its own.</li>
          <li><code>pop</code> and <code>flash</code> — short effects on a thing, without changing what it is.</li>
        </ul>
