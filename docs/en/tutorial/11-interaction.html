def update(dt):

          body: `
            <p>This script asked the mouse three different questions. They look like the same one, but the difference shows where two shapes overlap.</p>
            <p><code>@click</code> and <code>@hover</code> are <strong>events</strong>: Scena calls your function once, at the instant something happens (a click, an enter, an exit), and only for the object on top. <code>pointer_hover</code> is a <strong>state</strong>: a yes-or-no answer that holds right now, read every frame in <code>update</code>, also only for the object on top. <code>contains_point</code>, on the other hand, is a <strong>geometry</strong> question asked of one shape: does the point fall inside its drawing? It does not care who is on top, and that is why, where the square covers the hexagon, both shapes say yes.</p>

                <text x="196" y="64">square</text>
                <text x="176" y="140">mouse</text>
                <text x="262" y="52">@click / @hover:</text>
                <text x="262" y="67">  only square</text>
                <text x="262" y="102">pointer_hover:</text>
                <text x="262" y="117">  True only on square</text>
                <text x="262" y="152">contains_point(mouse):</text>
                <text x="262" y="167">  True on both</text>

              <figcaption>The mouse where the square covers the hexagon. The click, the hover and <code>pointer_hover</code> belong to one object only, the one on top. <code>contains_point</code> answers for each shape, by its own drawing.</figcaption>
            </figure>
            <p>To choose: something that happens once (changing the color, playing a sound) goes in an event; something that lasts while the mouse is there (spinning, pushing) reads the state in <code>update</code>; and when you want every shape under a point, even the ones underneath, ask each one with <code>contains_point</code>.</p>
            <p>In the Guide: <a href="../guide/index.html#ptr-hover">Hover</a> · <a href="../guide/index.html#frame-mouse">Mouse</a>.</p>
          `
        }

        <ul>
          <li><code>@click</code> on a group — one function for every shape in the group; it receives the one clicked. Where two overlap, only the one on top.</li>
          <li><code>@hover</code> and <code>@hover_exit</code> — the mouse came in, the mouse went out: two events, always in a pair.</li>
          <li><code>pointer_hover</code> — a state: is the mouse on top right now? Read every frame, in <code>update</code>.</li>
          <li><code>mouse.press(Mouse.BTN_RIGHT)</code> — is the right button held right now?</li>
          <li><code>contains_point</code> — does the point fall inside this shape's drawing? It works for each one, even the ones underneath.</li>
