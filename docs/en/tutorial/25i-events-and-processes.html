      body: [
        `
        <p>Throughout the series, your code has run in many ways: in <code>update</code>, in a <code>@collide</code>, in an <code>@every</code>, after an <code>after</code>, in a formula, in an <code>async</code> mode. Each tutorial introduced the piece its game needed. This interlude puts the pieces together into one idea, with a crossing: a street, a traffic light, cars and pedestrians.</p>
        <p>It all starts with the <strong>frame</strong>. A Scena game is a line of frames, about 60 per second, and in each one Scena does the same things, always in the same order:</p>
        <figure class="fig">

                <tr><td>a sequence with waits, for what the object is doing</td><td>an <code>async</code> mode</td></tr>
                <tr><td>one more sequence, or one that belongs to no object</td><td><code>run_task</code></td></tr>
              </tbody>
            </table></div>
            <p>The most common mistakes with time, and what Scena says:</p>
            <ul>
              <li><code>wait(1)</code> without <code>await</code> waits for nothing. Scena refuses it, naming the line and the missing <code>await</code>.</li>
              <li>An event cannot be <code>async</code>: <code>async def on_click(self)</code> would never run, and Scena refuses it. The event is a plain <code>def</code> that starts the sequence, by changing the mode or calling <code>run_task</code>.</li>
              <li>Calling an <code>async</code> function without <code>await</code> (<code>self.flicker()</code> alone on a line, for an <code>async def flicker</code>) runs nothing. Scena warns you (SCENA WARNING) with the line.</li>
              <li><code>run_task(cycle())</code>, with parentheses, is refused: pass the function, <code>run_task(cycle)</code>.</li>
              <li>A <code>while True</code> without <code>await</code> freezes the game; Scena cancels the task and tells you.</li>
            </ul>
