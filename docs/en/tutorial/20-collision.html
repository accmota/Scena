        <p>The setup is simple: a hero, a coral circle that walks with the arrow keys, and five crates.</p>

    Rect(center=(x, y), width=70, height=70, color="peru", group="crate")

hero = Circle(center=(120, 560), radius=22, color="coral", group="hero")
hero.pace = 260
resolve("hero", "crate")

    step = hero.pace * dt

    if keyp("RIGHT"):

    if keyp("DOWN"):

run()

            <p>There are two ways to find out about a collision.</p>
            <p>A <strong>rule</strong> stays in force and calls your function when the touch happens: <code>@collide</code> (it started), <code>@collide_stay</code> (it goes on), <code>@collide_exit</code> (it ended), or <code>resolve</code>, which holds things apart. You write it once, at the top level of the file or in the class.</p>
            <p>A <strong>question</strong> is asked on the spot, when your code wants to know: on a click, in an <code>update</code>, in an event.</p>
            <div class="tbl"><table>
              <thead><tr><th>Question</th><th>Answers</th></tr></thead>
              <tbody>
                <tr><td><code>collision.query_point(x, y)</code></td><td>Who is at this point (a list).</td></tr>
                <tr><td><code>collision.query_circle(x, y, radius=)</code></td><td>Who is in this round area.</td></tr>
                <tr><td><code>collision.query_sector(…)</code></td><td>Who is in a cone, like a guard's field of view.</td></tr>
                <tr><td><code>collision.raycast(a, p2=b)</code></td><td>The first thing the line from <code>a</code> to <code>b</code> hits, and where.</td></tr>
                <tr><td><code>shape.contains_point(p)</code></td><td>Whether the point falls inside this shape's drawing.</td></tr>
              </tbody>
            </table></div>
            <p>Without <code>group=</code>, the questions see only the objects some rule names. With <code>group=</code>, they see the members of that group, whether or not they are in a rule.</p>
            <p>In the Guide: <a href="../guide/index.html#colisao-collide">Detect</a> · <a href="../guide/index.html#colisao-aux">Queries</a>.</p>
