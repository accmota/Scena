# Publishes to PyPI when a version tag is pushed: `git tag v0.7.0 && git push
# origin v0.7.0`. No token is stored: PyPI trusts this workflow ("Trusted
# Publishing", set up on pypi.org for accmota/Scena, release.yml, environment
# `pypi`). Then it makes the tag's GitHub Release with scena-examples.zip, the
# file README.md links (releases/latest/download/scena-examples.zip).
# Procedure: design/Scena Design.md, "Compatibility and versions".
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # A tag that disagrees with scena/_version.py, or a release with no
      # dated CHANGELOG section, stops here, before anything is uploaded.
      - name: The tag matches the version and the changelog
        run: |
          version=$(python -c "import runpy; print(runpy.run_path('scena/_version.py')['__version__'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but scena/_version.py says $version"
            exit 1
          fi
          if ! grep -qE "^## $version — [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $version — YYYY-MM-DD' section"
            exit 1
          fi

      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*

      - name: The wheel holds both packages and py.typed
        run: |
          unzip -l dist/*.whl > contents.txt
          grep -q "scena/py.typed" contents.txt
          grep -q "scena_editor/__main__.py" contents.txt

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/scena/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # The examples and only the media they use, zipped from the committed list
  # (tools/release/examples_zip.txt, kept current by tests/test_examples_zip.py)
  # with the standard library alone. After PyPI took the version, so the zip
  # never belongs to a version pip cannot install; a failure here leaves PyPI as is.
  examples:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python tools/release/make_examples_zip.py
      - name: Attach the zip to the tag's GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/scena-examples.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/scena-examples.zip --verify-tag \
              --title "Scena $version" \
              --notes "pip install scena==$version. What changed: https://github.com/accmota/Scena/blob/$GITHUB_REF_NAME/CHANGELOG.md. scena-examples.zip holds the examples and the images and sounds they use."
          fi
