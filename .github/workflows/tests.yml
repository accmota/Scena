# Tests on every push to main and every pull request: the README's promise
# (Python 3.12-3.15 on Windows, macOS and Linux), checked on GitHub's runners.
# What each cell runs and what CI does not cover: design/Testing Design.md,
# "Continuous integration".
#
# Every cell builds the wheel, installs it with the test extra, and imports
# scena and scena_editor from site-packages (outside the checkout), so a file
# missing from the wheel or a native dependency without a wheel for that
# Python fails here. Then the tests run from the checkout (run_tiers.py puts
# the repo root first on the children's path): the whole quick tier on
# Ubuntu with Python 3.14, split over three runner jobs (`--part`; one job
# took ~11 min), and the smoke modules below on every other cell. Everything
# is headless (no window, no GL context, the offline audio mixer), so no
# display is needed.
name: Tests

# A branch named ci/<anything> runs it on push too, without a pull request.
on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # Modules for the cells that do not run the quick tier: the API
  # surface, a frame, shapes, collision, drawing, text and fonts, audio,
  # level files, the editor's launch, every example run headless, and the
  # Windows / Linux portability guards.
  SMOKE: >-
    test_api_surface test_act test_shapes test_collision test_visuals
    test_text test_audio test_audio_effects test_level test_editor_launch
    test_editor_i18n test_scripts_run test_platform_portability

jobs:
  test:
    name: ${{ matrix.os }} · ${{ matrix.python }} · ${{ matrix.part && format('quick {0}', matrix.part) || 'smoke' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14", "3.15"]
        part: [""]          # "" = smoke; "K/3" = that part of the quick tier
        exclude:
          - os: ubuntu-latest
            python: "3.14"
        # Each entry would overwrite an original value, so each is a cell of
        # its own (GitHub's include rules).
        include:
          - { os: ubuntu-latest, python: "3.14", part: "1/3" }
          - { os: ubuntu-latest, python: "3.14", part: "2/3" }
          - { os: ubuntu-latest, python: "3.14", part: "3/3" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # skia-python's Linux wheel loads the system's libEGL / libGL at import.
      # A desktop Linux has them; the runner image does not.
      - name: Linux libraries skia needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libegl1 libgl1

      # Into the runner's temp folder; setuptools' build/ and egg-info go too,
      # so the tests' source scans see the checkout alone.
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir "$RUNNER_TEMP/dist"
          rm -rf build scena.egg-info

      - name: Install the wheel with the test extra
        run: python -m pip install "$(ls "$RUNNER_TEMP"/dist/scena-*.whl)[test]"

      # From outside the checkout, so the import cannot find the source tree.
      - name: Import the installed wheel
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'EOF'
          import os, sys
          import scena, scena_editor
          root = os.path.normcase(os.path.realpath(os.environ["GITHUB_WORKSPACE"]))
          for mod in (scena, scena_editor):
              where = os.path.normcase(os.path.realpath(mod.__file__))
              print(mod.__name__, where)
              if where.startswith(root + os.sep):
                  sys.exit(f"{mod.__name__} imported from the checkout, not the wheel")
          print("scena", scena.__version__, "on Python", sys.version.split()[0])
          EOF
          scena-editor --help > /dev/null

      # No miniaudio wheel for Python 3.15: the wheel above must have
      # installed and imported without it (the marker in pyproject.toml).
      # The audio tests need it, so build it from source (the runners have a
      # C compiler).
      - name: miniaudio from source (no wheel for this Python)
        if: matrix.python == '3.15'
        run: |
          python -c "import importlib.util, sys; sys.exit('miniaudio was installed: check the marker' if importlib.util.find_spec('miniaudio') else 0)"
          python -m pip install miniaudio

      - name: Quick tier, one part
        if: matrix.part != ''
        run: python tests/run_tiers.py quick --part ${{ matrix.part }} -j 4

      - name: Smoke modules
        if: matrix.part == ''
        run: python tests/run_tiers.py focused $SMOKE -j 4

      - name: Keep the logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ matrix.os }}-${{ matrix.python }}-${{ strategy.job-index }}
          path: .scena_test_runs/
          include-hidden-files: true
          retention-days: 7
